<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>Suggestion inbox</title>
<style>
body{font-family:system-ui,Segoe UI,Roboto,sans-serif;max-width:760px;margin:0 auto;padding:16px;color:#2b2b3a;background:#f7f3ee;line-height:1.45}
h1{font-size:1.4rem}.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
button,select{font:inherit;padding:8px 14px;border-radius:10px;border:1px solid #cfc7d6;background:#fff;cursor:pointer}
.s{background:#fff;border-radius:12px;padding:12px 14px;margin:10px 0;box-shadow:0 1px 4px rgba(0,0,0,.08)}
.m{font-size:.82rem;color:#6d6478}.t{font-size:1.02rem;margin:6px 0;white-space:pre-wrap}
.tag{display:inline-block;padding:1px 9px;border-radius:99px;background:#eee7f3;margin-right:4px;font-size:.78rem}.ok{background:#dff3e3}.no{background:#fbe3e0}
</style></head><body>
<h1>Suggestion inbox</h1>
<p class="m">Newest first. Better Me, Topix and Love Bombs all send here. Green "OK to use" = the person ticked the permission box.</p>
<div class="bar"><select id="f"><option value="all">Everything</option><option value="card">Card ideas only</option><option value="betterme">Better Me</option><option value="topix">Topix</option><option value="lovebombs">Love Bombs</option></select>
<button id="cp">Copy all shown</button><button id="dl">Download as spreadsheet (CSV)</button><span id="n" class="m"></span></div>
<div id="list">Loading...</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
firebase.initializeApp({apiKey:"AIzaSyApYY65cMD4QyKcWDVliFJ6-tb1mpNeThU",authDomain:"better-me-game.firebaseapp.com",projectId:"better-me-game",appId:"1:385247377726:web:5176e8508a03b9e4e7946f"});
const $=i=>document.getElementById(i),esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const GN={betterme:'Better Me',topix:'Topix',lovebombs:'Love Bombs'};
let all=[],shown=[];
const dt=t=>t?new Date(t).toLocaleString(undefined,{year:'numeric',month:'short',day:'numeric',hour:'numeric',minute:'2-digit'}):'';
const credit=s=>s.creditChoice&&s.creditChoice!=='none'&&s.creditName?'Card concept donated by '+s.creditName:'';
function draw(){
 const f=$('f').value;
 shown=all.filter(s=>f==='all'||(f==='card'?s.topic==='A card':(s.game||'betterme')===f));
 $('n').textContent=shown.length+' shown of '+all.length;
 $('list').innerHTML=shown.map(s=>`<div class="s"><div class="m"><span class="tag">${esc(GN[s.game||'betterme']||s.game)}</span><span class="tag">${esc(s.topic||'')}</span>${s.consent?'<span class="tag ok">OK to use</span>':'<span class="tag no">no permission box ticked</span>'}${esc(dt(s.at))} · from ${esc(s.name||'?')}</div>
 <div class="t">${esc(s.text)}</div>${credit(s)?`<div class="m">Credit: ${esc(credit(s))}</div>`:''}${(s.plus||[]).length?`<div class="m">${s.plus.length} "me too"</div>`:''}</div>`).join('')||'<p>Nothing here yet.</p>';
}
$('f').onchange=draw;
$('cp').onclick=()=>{const t=shown.map(s=>`[${GN[s.game||'betterme']||s.game} / ${s.topic}] ${s.text}${credit(s)?'  ('+credit(s)+')':''}${s.consent?'':'  (no permission ticked)'}`).join('\n\n');navigator.clipboard.writeText(t).then(()=>alert('Copied.'),()=>prompt('Copy:',t))};
$('dl').onclick=()=>{const q=v=>'"'+String(v==null?'':v).replace(/"/g,'""')+'"';
 const rows=[['date','game','about','suggestion','permission ticked','permission wording version','credit choice','credit name','from']].concat(shown.map(s=>[new Date(s.at||0).toISOString(),s.game||'betterme',s.topic,s.text,s.consent?'yes':'no',s.consentVersion||'',s.creditChoice||'',s.creditName||'',s.name||'']));
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'}));a.download='suggestions.csv';a.click()};
firebase.auth().signInAnonymously().then(()=>firebase.firestore().collection('suggestions').orderBy('at','desc').limit(500).onSnapshot(s=>{all=s.docs.map(d=>d.data());draw()},e=>{$('list').textContent='Could not load: '+e.message}),e=>{$('list').textContent='Could not connect.'});
</script></body></html>
