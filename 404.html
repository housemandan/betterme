<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="5;url=/">
    <title>Page Not Found - Better Me</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }
        
        .container {
            background: white;
            border-radius: 12px;
            padding: 3rem;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            font-size: 4rem;
            color: #2c3e50;
            margin-bottom: 1rem;
        }
        
        h2 {
            font-size: 1.5rem;
            color: #34495e;
            margin-bottom: 1.5rem;
        }
        
        p {
            font-size: 1.1rem;
            line-height: 1.6;
            color: #555;
            margin-bottom: 1rem;
        }
        
        .message {
            background: #f8f9fa;
            padding: 1.5rem;
            border-radius: 8px;
            margin: 2rem 0;
        }
        
        .email {
            color: #667eea;
            font-weight: 600;
            text-decoration: none;
        }
        
        .email:hover {
            text-decoration: underline;
        }
        
        .redirect-notice {
            font-size: 0.95rem;
            color: #999;
            margin-top: 2rem;
        }
        
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(102, 126, 234, 0.3);
            border-radius: 50%;
            border-top-color: #667eea;
            animation: spin 1s ease-in-out infinite;
            margin-left: 0.5rem;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 3rem;
            }
            
            h2 {
                font-size: 1.2rem;
            }
            
            .container {
                padding: 2rem 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        
        <div class="message">
            <p>We've simplified our website and this page no longer exists.</p>
            <p>For product inquiries or support, please contact us at:</p>
            <p><a href="mailto:bettermegame@gmail.com" class="email">bettermegame@gmail.com</a></p>
            <p style="margin-top: 1rem;">You can also find our products on <strong>Amazon</strong>.</p>
        </div>
        
        <p class="redirect-notice">
            Redirecting you to our homepage in 5 seconds<span class="spinner"></span>
        </p>
    </div>
</body>
</html>
