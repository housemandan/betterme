ile to receive their point.", "When you make a mistake, slip and fall, or say something embarrassing that makes others laugh, are you able to laugh at yourself as well? Taking ourselves lightly, and being able to smile and laugh when we mess up, is a quality that makes us fun to be around, and saves us from the stress of trying to be perfect. Receive 1 point for drawing this card and sharing. All players are welcome to share.", "Have you ever been a hero, saving someone from injury or death? Has anyone ever helped you in this way? Receive one point for drawing this card and sharing. Any player who has been a hero or has been helped by one may share their story and receive 1 point.", "Do you know someone who is sick or feeling down at the moment, and could use some encouragement? Consider a visit, phone call, card, email, etc. 1 point for drawing this card. 1 point to any player who commits to cheering someone up.", "Would you like to be around new people, meet new friends, or a romantic partner? If so, how can you put yourself in the position to meet new people? Could you get a job that involves meeting lots of people, frequent a new coffee shop, join online groups, use public transportation, try a new hobby, join a local club, volunteer etc.? It could even be as simple as saying hello to strangers more often. You’d be amazed how many ideas you can come up with in just a few minutes of brainstorming. 1 point for drawing this card. Any player may earn one additional point for committing to trying a new strategy for meeting people, or 5 minutes of brainstorming for ideas.", "What makes a great friend? When have you been a great friend? 1 point for drawing this card and sharing. All players are welcome to share.", "Think of a family, other than your own, that is a great example of what a family can be. What is it about this family that impresses you? 1 point for drawing this card and sharing. All players are welcome to share.", "Think of an excellent piece of advice you have received. Who gave it to you and how did it help you? 1 point for drawing this card. All players are welcome to share.", "How concerned are you with others’ opinions of you? How does what others think influence your life? Are you satisfied with this, or is it something you’d like to change? If you start to take others’ opinions of yourself too seriously, you might think of the time Walt Disney was fired by a newspaper editor because \"he lacked imagination and had no good ideas.\" 1 point for drawing this card and sharing. All players are welcome to share.", "Is there someone important to you, who you haven’t talked with lately? Sometimes we get busy with things that seem more urgent and may not make time for the people we value most. Feeling guilty doesn’t help anyone, so just pick up the phone or send them an message! 1 point for drawing this card. 1 additional point to any player who commits to contacting someone important to them.", "How are your relationships with your neighbors? How important are these relationships to you? What is one thing you could do to improve a relationship with a neighbor or neighbors? 1 point for drawing this card and sharing. One additional point to any player committing to a positive action involving neighbors.", "What is trust? Who do you trust? Who trusts you? 1 point for drawing this card and sharing. Any player is welcome to share.", "Is there someone you want to spend more time with? How can you make this happen? What is one action you could take today to make this a reality? One point for drawing this card and sharing. One additional point to any player committing to taking one action TODAY to spend more quality time with someone.", "Do you tell jokes? Do you know a few? Any player is welcome to tell a joke now. The player drawing this card may earn 1 point for telling a joke now, or for committing to learning and telling at one new joke."], "Fall Forward": ["Challenges are the fire in which we forge the steel of our character. They give us strength for future endeavors. “What we learn through failure becomes a precious part of us, strengthening us in everything we do. So let the tough things make you tougher.” -Soichiro Honda, founder of Honda", "Some of our most powerful learning opportunities lie in our challenges, failures, and disappointments. If you are looking for the lesson, you are much more likely to find it. You may only need to make a minor change on a future attempt, to get much improved results.", "\"All life is an experiment. The more experiments you make the better.\" -Ralph Waldo Emerson", "Randy Pausch on obstacles: “The brick walls are there for a reason. The brick walls are not there to keep us out. The brick walls are there to give us a chance to show how badly we want something. Because the brick walls are there to stop the people who don’t want it badly enough. They’re there to stop the other people.” If you haven’t watched or read “The Last Lecture” by Randy Pausch, please consider doing so. It’s one of the most important and powerful talks of our time.", "Can you think of a challenge you experienced that taught you a valuable lesson? You may share if you like.", "In the midst of a difficult time, are you able to see the opportunity to grow stronger and wiser?", "So, something has you disappointed, upset, sad, angry, etc. Here’s an interesting question: Will it matter in a year? Will it matter in two years, or in five? If the answer to any of these is no, then how much does it matter now? Asking yourself these questions might help negative emotions fade a bit more quickly the next time you face a challenging time.", "Congratulations, you failed! That means you had the guts to take action! And with every failure we learn lessons we can apply to future endeavors. So, don’t be ashamed of failure. Remember that the people who accomplish the most in life, often fail the most in the process. Go check out some biographies of your heroes and you’ll likely learn of many failures you hadn’t heard about.", "You bought a seminar! The next time you lose money on a project, investment, etc., think of what you learned. Many people willingly spend good money to learn life lessons, so think of your “loss” as an investment in your future. You bought a seminar!", "You got a degree! Did you lose time and/or money on a project or idea that didn’t pan out? Join the club! Did you learn valuable skills or lessons in the process? That sort of real world experience can often be less expensive and just as valuable as a college degree. So, think of the time, energy and money as an investment that will make you wiser and more effective in the future.", "Most of us have heard of baseball legend Babe Ruth and his home run records. But did you know that Ruth’s record of 1,330 career strikeouts stood for 30 years? And it was broken by none other than fellow baseball legend Mickey Mantle! So step up to the plate and take another swing. And if you do strike out this time, remember that you’re in excellent company.", "Oh, you failed? You’re feeling down? I challenge you to go do a web search for “famous failures” or similar phrases. I guarantee you will be shocked by the failures of many people that are often revered as “visionaries” and “naturals”. What do their stories have in common? They kept going… one step at a time."]}</script>
  <script type="application/json" id="slug-data">{"Mind": "mind", "Tangibles": "tangibles", "Body": "body", "Heart": "heart", "People": "people", "Fall Forward": "fallforward"}</script>
  <script>
    const CARDS = JSON.parse(document.getElementById('card-data').textContent);
    const SLUGS = JSON.parse(document.getElementById('slug-data').textContent);

    const deckEl = document.getElementById('deck');
    const drawnEl = document.getElementById('drawn');
    const drawnCard = document.getElementById('drawnCard');
    const drawnContent = document.getElementById('drawnContent');
    const drawnStripe = document.getElementById('drawnStripe');
    const drawnCat = document.getElementById('drawnCat');
    const drawnText = document.getElementById('drawnText');
    const drawAgainBtn = document.getElementById('drawAgain');
    const backBtn = document.getElementById('backToDeck');

    let currentCategory = null;
    const piles = {};

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function refillPile(category) {
      piles[category] = shuffle([...Array(CARDS[category].length).keys()]);
    }

    function drawIndex(category) {
      if (!piles[category] || piles[category].length === 0) {
        refillPile(category);
      }
      return piles[category].pop();
    }

    function showCard(category, animate) {
      const idx = drawIndex(category);
      const text = CARDS[category][idx];
      const slug = SLUGS[category];

      drawnCard.style.setProperty('--accent', `var(--${slug})`);
      drawnCat.textContent = category;
      drawnText.textContent = text;

      if (animate) {
        drawnContent.classList.add('swapping');
        requestAnimationFrame(() => {
          drawnContent.classList.remove('swapping');
        });
      }
    }

    deckEl.querySelectorAll('.cat-card').forEach((btn) => {
      btn.addEventListener('click', () => {
        currentCategory = btn.dataset.cat;
        showCard(currentCategory, false);
        deckEl.hidden = true;
        drawnEl.hidden = false;
        backBtn.focus();
      });
    });

    drawAgainBtn.addEventListener('click', () => {
      if (!currentCategory) return;
      showCard(currentCategory, true);
    });

    backBtn.addEventListener('click', () => {
      drawnEl.hidden = true;
      deckEl.hidden = false;
    });
  </script>
</body>
