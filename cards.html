<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Better Me — Draw a Card</title>
<meta name="description" content="Draw a random Better Me card from any category: Mind, Tangibles, Body, Heart, People, or Fall Forward.">
<meta name="theme-color" content="#1b2620">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;800;900&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #1b2620;
    --bg-2: #283a30;
    --paper: #fbf8f1;
    --paper-edge: #efe9dc;
    --ink: #2b2521;
    --ink-soft: #8a8074;

    --mind: #5c7aa0;
    --tangibles: #c99a4b;
    --body: #bd6a4a;
    --heart: #b2495a;
    --people: #6e9b7b;
    --fallforward: #8a6fae;
  }

  * { box-sizing: border-box; }

  html, body { margin: 0; }

  body {
    min-height: 100vh;
    background: radial-gradient(ellipse 90% 60% at 50% -10%, var(--bg-2), var(--bg) 65%);
    background-attachment: fixed;
    color: var(--paper);
    font-family: 'Archivo', system-ui, -apple-system, 'Segoe UI', sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 16px 48px;
  }

  .wrap {
    width: 100%;
    max-width: 640px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  header {
    text-align: center;
    margin-bottom: 30px;
  }

  h1 {
    font-size: clamp(28px, 7vw, 42px);
    font-weight: 900;
    letter-spacing: 0.01em;
    margin: 0;
  }

  .tagline {
    font-size: 13px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: rgba(251, 248, 241, 0.6);
    margin-top: 8px;
  }

  /* ---------- Deck (category cards) ---------- */

  .deck {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 16px 14px;
    width: 100%;
    max-width: 380px;
  }

  @media (min-width: 560px) {
    .deck { grid-template-columns: repeat(3, 1fr); max-width: 620px; gap: 22px 18px; }
  }

  .cat-card {
    appearance: none;
    border: none;
    background: var(--paper);
    border-radius: 14px;
    padding: 0;
    aspect-ratio: 0.72;
    cursor: pointer;
    position: relative;
    overflow: hidden;
    box-shadow: 0 6px 16px rgba(0, 0, 0, 0.35);
    transform: rotate(var(--rot, 0deg));
    transition: transform 0.22s ease, box-shadow 0.22s ease;
    display: flex;
    flex-direction: column;
    font-family: inherit;
    color: var(--ink);
    opacity: 0;
    animation: deal 0.5s ease forwards;
    animation-delay: calc(var(--d) * 0.06s);
  }

  @keyframes deal {
    from { opacity: 0; transform: rotate(var(--rot, 0deg)) translateY(14px) scale(0.92); }
    to { opacity: 1; transform: rotate(var(--rot, 0deg)) translateY(0) scale(1); }
  }

  .cat-card::before {
    content: "";
    display: block;
    height: 16%;
    background: var(--accent);
  }

  .cat-card .cat-name {
    margin: auto 0 0;
    padding: 0 12px;
    font-weight: 800;
    font-size: clamp(15px, 4.4vw, 19px);
    letter-spacing: 0.01em;
    line-height: 1.15;
  }

  .cat-card .cat-count {
    padding: 4px 12px 14px;
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .cat-card:hover,
  .cat-card:focus-visible {
    transform: rotate(0deg) translateY(-6px) scale(1.05);
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.4);
    outline: none;
  }

  .cat-card:focus-visible {
    box-shadow: 0 14px 26px rgba(0, 0, 0, 0.4), 0 0 0 3px var(--paper), 0 0 0 5px var(--accent);
  }

  .cat-card:active {
    transform: rotate(0deg) translateY(-2px) scale(1.01);
  }

  /* ---------- Drawn card view ---------- */

  .drawn {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .drawn[hidden], .deck[hidden] { display: none; }

  .drawn-card {
    width: 100%;
    background: var(--paper);
    border-radius: 18px;
    box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    overflow: hidden;
    display: flex;
    flex-direction: column;
    min-height: 380px;
    animation: deal-in 0.32s ease;
  }

  @keyframes deal-in {
    from { opacity: 0; transform: translateY(18px) scale(0.97); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .drawn-card .stripe {
    height: 10px;
    background: var(--accent, var(--mind));
    flex-shrink: 0;
  }

  .drawn-card .content {
    padding: 26px 24px 30px;
    display: flex;
    flex-direction: column;
    flex: 1;
    transition: opacity 0.15s ease;
  }

  .drawn-card .content.swapping {
    opacity: 0;
  }

  .drawn-cat {
    font-weight: 800;
    font-size: 13px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-soft);
  }

  .drawn-rule {
    height: 1px;
    background: var(--paper-edge);
    margin: 14px 0 18px;
  }

  .drawn-text {
    font-family: 'Source Serif 4', Georgia, 'Times New Roman', serif;
    font-size: clamp(17px, 4.4vw, 21px);
    line-height: 1.55;
    color: var(--ink);
    flex: 1;
  }

  /* ---------- Actions ---------- */

  .actions {
    display: flex;
    flex-direction: column;
    gap: 12px;
    width: 100%;
    margin-top: 22px;
  }

  .btn {
    appearance: none;
    border: none;
    border-radius: 999px;
    font-family: 'Archivo', sans-serif;
    font-weight: 800;
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 14px 22px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, opacity 0.15s ease;
  }

  .btn:active { transform: scale(0.98); }

  .btn-primary {
    background: var(--paper);
    color: var(--ink);
  }

  .btn-primary:hover, .btn-primary:focus-visible {
    background: #ffffff;
  }

  .btn-secondary {
    background: transparent;
    color: var(--paper);
    border: 1px solid rgba(251, 248, 241, 0.35);
  }

  .btn-secondary:hover, .btn-secondary:focus-visible {
    border-color: rgba(251, 248, 241, 0.7);
    background: rgba(251, 248, 241, 0.06);
  }

  .btn:focus-visible {
    outline: 2px solid var(--paper);
    outline-offset: 3px;
  }

  footer {
    margin-top: 40px;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: rgba(251, 248, 241, 0.45);
    text-align: center;
  }

  footer a {
    color: inherit;
    text-decoration: none;
    border-bottom: 1px solid rgba(251, 248, 241, 0.3);
  }

  footer a:hover { color: var(--paper); border-color: var(--paper); }

  @media (prefers-reduced-motion: reduce) {
    .cat-card, .drawn-card, .content, .btn {
      animation: none !important;
      transition: none !important;
    }
    .cat-card { opacity: 1; transform: rotate(var(--rot, 0deg)); }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>Better Me</h1>
      <p class="tagline">Pick a category. Draw a card.</p>
    </header>

    <div class="deck" id="deck">
        <button class="cat-card" data-cat="Mind" style="--accent: var(--mind); --rot: -3deg; --d: 0">
          <span class="cat-name">Mind</span>
          <span class="cat-count">50 cards</span>
        </button>
        <button class="cat-card" data-cat="Tangibles" style="--accent: var(--tangibles); --rot: 2deg; --d: 1">
          <span class="cat-name">Tangibles</span>
          <span class="cat-count">49 cards</span>
        </button>
        <button class="cat-card" data-cat="Body" style="--accent: var(--body); --rot: -2deg; --d: 2">
          <span class="cat-name">Body</span>
          <span class="cat-count">43 cards</span>
        </button>
        <button class="cat-card" data-cat="Heart" style="--accent: var(--heart); --rot: 3deg; --d: 3">
          <span class="cat-name">Heart</span>
          <span class="cat-count">53 cards</span>
        </button>
        <button class="cat-card" data-cat="People" style="--accent: var(--people); --rot: -4deg; --d: 4">
          <span class="cat-name">People</span>
          <span class="cat-count">52 cards</span>
        </button>
        <button class="cat-card" data-cat="Fall Forward" style="--accent: var(--fallforward); --rot: 2deg; --d: 5">
          <span class="cat-name">Fall Forward</span>
          <span class="cat-count">12 cards</span>
        </button>
    </div>

    <div class="drawn" id="drawn" hidden>
      <div class="drawn-card" id="drawnCard">
        <div class="stripe" id="drawnStripe"></div>
        <div class="content" id="drawnContent">
          <div class="drawn-cat" id="drawnCat"></div>
          <div class="drawn-rule"></div>
          <div class="drawn-text" id="drawnText"></div>
        </div>
      </div>
      <div class="actions">
        <button class="btn btn-primary" id="drawAgain">Draw another</button>
        <button class="btn btn-secondary" id="backToDeck">Choose a different category</button>
      </div>
    </div>

    <footer>
      <a href="https://www.bettermegame.com">bettermegame.com</a>
    </footer>
  </div>

  <script type="application/json" id="card-data">{"Mind": ["Eliminate “I can’t”, “you can’t”, and “we can’t” from your speech for the remainder of the game. Replace with empowering phrases “I haven’t yet decided to”, “I haven’t yet put in the effort to”, etc. Say a forbidden phrase, and the first player who says “thank you” before the next roll of the dice gets to take any one point from you, assuming you have one. You can lose only two points total in this manner. Receive one point for drawing this card.", "For the remainder of the game, eliminate the words “problem” and “difficulty” from your vocabulary. Replace them with empowering words like “challenge”, “obstacle”, “opportunity”, “puzzle” etc. Say “problem” or “difficulty” during this game and the first player who says “thank you” first before the next roll gets to choose any one point from you, assuming you have one. You can lose only two points total in this manner. Receive one point for drawing this card.", "Think of a current challenge in your life. Give three examples of a positive outcome, and receive one point.", "Create a written affirmation and place it somewhere you will see it often. Read it aloud with positive emotion at least twice daily for one month. Affirmations beginning with “I am” or “Life is” can be extremely powerful. If needed, many good guides are available online for creating an affirmation. Commit to creating and posting an affirmation within 2 days, and receive 2 points. Two points if you already use a visible affirmation(s). You do not need to share your affirmation with anyone, just tell your partner when it’s complete.", "Do not read the rest of this card aloud until after you have completed its instructions. Smile at the other players :) How do you feel? Did others smile? Could you smile at more people on a daily basis? Receive one point for drawing this card.", "Tell us something positive that some other players may not know about you? A strength, a past accomplishment, a way that you help others, etc? Receive one point for sharing.", "What good news have you heard lately? Share with the group and receive one point. All players are welcome to share.", "What are you looking forward to? Receive one point for drawing this card and sharing. All players are welcome to share.", "A “vision board” or “dream board” is inspiring tool to help you create your ideal life. Seeing your visions and dreams often helps lock them in your subconscious mind, programming your mind to create that reality. Any player currently using a vision board receives 1 point. Any player committing to create or update their vision board within 14 days receives 1 point.", "Travel is a wonderful way to experience new things and expand your mind. How has travel enriched your life? Where would you like to visit? One point for drawing this card. Any player is welcome to share.", "Friendly Creative Competition! In one minute, write as many words as you can using the letters in the first and last name of the person drawing this card. In each word, you may use each letter only as many times as it appears in the players name. Words allowed are the same as those allowed in the game of Scrabble®, and can easily be found online. The player with the most words receives one point.", "Friendly Creative Competition! All players write as many words as they can in one minute using the letters in the name of the city, county, state, province, country etc. that you are in. The player who drew this card chooses which name to use. In each word, you may use each letter only as many times as it appears in the name. Words allowed are the same as those allowed in the game of Scrabble®, and can easily be found online. The player with the most words receives one point.", "All players close their eyes for one minute and silently visualize a past success or successes. 1 point for drawing this card. Afterwards, players are welcome to share the success they thought of.", "Do you take the time to visualize your desired outcome, and the process of creating it? World-class achievers use visualization to prepare their mind and body to create a desired outcome. Whether you’re visualizing a jump shot, a paycheck or a loving relationship, visualization can be hugely effective. All players close your eyes for one minute and silently visualize something you’d like to occur in your life; see, hear, feel, smell, and taste as much detail as you can imagine. 1 point to all players.", "Can you think of a limiting belief you have? If so, where did this belief come from? Is it a fact or just something you choose to believe? How might you change this belief? If you wanted to, could you find evidence that your limiting belief is just a story you’ve been telling yourself? 1 point for drawing this card, all players are welcome to share.", "What’s an inspiring or empowering story you enjoy? It could be a book, movie, parable etc. How does it inspire you? 1pt for drawing this card and sharing. All players are welcome to share.", "If you are worried about something, ask yourself this: Will it matter in a month? A year? Five years? If the answer is no, then why worry now? And if the answer is yes, is there something you can do to change it? 1 point for drawing this card, any player is welcome to share.", "What was your biggest worry five years ago? Can you remember? How do you feel about it now? Is it as important now as it was then? Any thoughts? You may share with the group or keep this one private. 1 point for drawing this card, all players are welcome to share.", "Do you remember when last gossiped or talked poorly about someone? How do you feel looking back on it? What are your thoughts on gossip? 1 point for drawing this card.", "What are you good at? How did you become skilled at this? Do you think you had a natural talent for it, or did you have to work just as hard as anyone else? 1 point for drawing this card and sharing.", "What advantages or good fortune have you had in life? Were you born in a place with good health care and schools? Were you taught to read at a young age? Did you learn a trade from your family? What makes you fortunate? 1 point for drawing this card and sharing. All players are welcome to share.", "What promising prospects or opportunities lay ahead of you, or what opportunities could you create? Receive 1 point for drawing this card and sharing.", "What is something in your life that you could eliminate to make space for something more fulfilling? How could you do this? Receive 1 point for drawing this card and sharing. Any player may receive one additional point for committing to eliminating something from their life.", "Is change scary or exciting? Is it both? 1 point for drawing this card and sharing. Any player is welcome to share.", "What is risk? Is taking risk scary or exciting, or is it both? 1 point for drawing this card and sharing. Any player is welcome to share.", "What past success or achievement are you proud of? What skills and strengths do you possess that made that moment possible? 1 point for drawing this card and sharing.", "What is one of your greatest strengths? What do others think you are good at? Don’t be shy :) 1 point for drawing this card and sharing.", "Do you allow fear to hold you back from something you would like to be, do, or have? If you could conquer this fear, how would your life change? What action could you take in the next week to overcome this fear? Even just committing to gather information, read a book, schedule an appointment or class etc can be considered an action. 1 point for drawing this card, and 2 points to any player who makes a commitment to take action to overcome a limiting fear.", "Biographies can be a great way to be inspired by the success of people we admire. They are also a great tool to teach us that our heroes are not perfect. They’ve faced challenges and setbacks just like us! 2 points to any player committing to watching, reading or listening to a biography of someone they admire of someone they admire.", "What do you think about intuition or “gut instinct”? What do you do if advice from those around you differs from your intuition? Is there something in your life that your intuition is currently telling you to do? 1 point for drawing this card, all players are welcome to share.", "What do you do when things don’t go how you’d hoped? Do you make excuses? Do you learn from the experience, and take a more effective approach next time? Taking responsibility for your life gives your power and creativity. It’s been said that although you cannot control the wind, you can adjust the sails. What are your thoughts on this? 1 point for drawing this card, all players are welcome to share.", "It’s been said that a good example is the best sermon. Who is watching your example, and what do you want them to learn from it? 1 point for drawing this card and sharing. All players are welcome to share.", "In this exercise, all players take 1 minute to write down everything they see that is made of metal. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is made of wood. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see in the room that is made of fabric. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is made of paper. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is made of plastic. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is red. All players share their list. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is blue. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is green. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is black. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is white. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "In this exercise, all players take 1 minute to write down everything they see that is yellow. All players share their list. The player with the most items reads their list, and other players share what they saw that others did not. What does this exercise show you about what you see and “reality”? One point for drawing this card, and one point to the player(s) with the most items. A majority of players may vote to disqualify any item on a player’s list.", "What could go well today? Tomorrow? This year? All players are welcome to share. 1 point to the player drawing this card.", "A wise person once asked, “What great thing would you attempt if you knew you could not fail?” All players are welcome to share. 1 point for drawing this card.", "What is your “why”? Having goals gives you focus, and having a powerful purpose behind your goals gives you power. If your goal is to quit smoking, your “why” might be to run and play with your grandchildren 20 years from now. If your goal is to pay off your credit card debt, your “why” might be to work less and have more time for hiking. What “why” empowers you, and how do you remind yourself of it? One point for drawing this card. All players are welcome to share.", "Here’s an idea on goal-setting you may not have considered. “Laughably easy” daily goals are effective at getting a person in motion, and often lead to much more than the minimum action required. Examples might be a daily three minute walk, a daily donation of 50 cents to charity, three push-ups three times per day, or smiling at one stranger. Getting started is the key, momentum builds from there. One point to any player who sets a “laughably easy” daily goal for the next 7 days or more.", "Are your goals based on actions, or results? Are your goals “controllable”? Consider the difference between having this goal: “Be promoted to sales manager by June 1st” versus this goal: “Begin work by 8am daily, make at least 10 calls before lunch, and spend at least 30 minutes on training or education.” The goal of being promoted, while exciting, is not directly in your control. It may be discouraging if you work hard, but still do not get the promotion. Completing the second goal is fully in your control, will increase your productivity, and will increase the likelihood of promotion. This method of action-based goals can be very empowering, and can help you avoid discouragement by circumstances outside your control. Receive one point for drawing this card. Any player may share their thoughts.", "It’s often said that growth happens outside your comfort zone. How often do you try new and uncomfortable things? The more you try new things, the more you realize that the discomfort and the “butterflies” are totally normal. You can even train yourself to use those feelings to become excited about the opportunity to grow and increase your courage. Remember, without fear, courage cannot exist. Receive one point for drawing this card. Any player may receive one point committing to trying something new and uncomfortable.", "If you are worrying about a situation, it can be very helpful to consider the worst case scenario. It could be losing your job, your business, your relationship. Often, when we really stop to think about the worst that can happen, we realize that we could persevere through it if necessary. Worry will not solve your problem, only productive thoughts and actions will. Once we understand and acknowledge the worst case, we are often more calm and collected to think and take action to improve the situation. 1 point for drawing this card, all players are welcome to share their thoughts."], "Tangibles": ["Do you need to “declutter”, purge or organize your home or workspace? Do you keep things you never use? What is one way you could organize or clear your space? 1 point for drawing this card and sharing, 1 additional point for any player committing to specific action to improve their space.", "Do you have a pond, flowers, bird feeder, bird house, bird bath, or other contraptions designed to bring local wildlife to you? It can be an entertaining addition to your home, and help your animal friends live a little more easily. 1 point for drawing this card, and one point to any player committing to adding something to their home to attract wildlife etc.", "If you had to visit a country of your choice tomorrow, and for any amount of time you choose, where would you go? Why? 1 point for drawing this card and sharing. All players are welcome to share.", "If responsible use of credit cards is a challenge for you, here’s a creative solution. Place your card in a container, fill it with water and put it in the freezer. Using the “ice block method” your credit card is available in just minutes if you need it, but it’s not accessible immediately for unwise spending. 1 point for drawing this card.", "If you are currently in debt on multiple credit cards or other debts, it often makes sense to pay down the highest interest loans first. Sometimes it is tempting to first pay down the smallest loan, the car loan, etc. Generally you will save money by paying down the highest interest loan first, and then moving on to the next highest interest loan. Of course there may be other considerations in any particular situation, and you may want to seek qualified advice financial advice. 1 point for drawing this card. All players are welcome to share.", "Is there something you’d like to practice, learn, create, or pursue, but you feel you don’t have the time? Consider creating time for these fulfilling activities by removing obligations that spend your time, money and energy. Could you get rid of the fancy car payment that has you working overtime, opt-out of meetings, work part-time instead of full time, etc. Is there another way to live? 1 point for drawing this card. One additional point to any player who commits to removing or reducing a time obligation.", "Consider donating time and/or money to a cause you believe in. This could be a big name charity, your local church, museum, sports team, scout group, school, etc. You will feel good about your contribution, and will begin to associate your surplus time and money to an increased ability to help people. 1 point to any player who shares a rewarding experience they’ve had contributing time or money to a cause they believe in. 1 additional point to any player who commits to donate time or money to a cause in the next month.", "Every time you buy something, you’re voting with your wallet. Who and what are you supporting with your purchases? What values, companies and people do you want to support? Why? 1 point for drawing this card and sharing. All players are welcome to share.", "What could be improved about your living situation, your space, decor, roommates, yard, etc? What actions could you take to improve it? 1 point for drawing this card and sharing. One additional point for any player committing to an action to improve their living situation.", "Variety in your day can be refreshing and stimulating. You could try a different route on your next trip home, listen to new music, take the stairs instead of the elevator, try a new restaurant, walk or bike instead of driving, etc. How can you add variety to your life? 1 point for drawing this card and sharing. One additional point to any player committing to a specific action adding variety to their life.", "What is something in your surroundings right now, that you took for granted until this moment? All players are encouraged to notice something that is beautiful, useful, comforting, pleasant, etc. What does this exercise tell us? 1 point for drawing this card. All players are welcome to share.", "What are three things you own or have access to that you sometimes take for granted? Your refrigerator, car, glasses, furnace, fruit in the winter etc? 1 point for drawing this card and sharing with the group.", "If you had all the money you could ever want, what would you buy for yourself? What would you buy for someone else? 1 point for drawing this card. All players are welcome to share.", "What does “success” mean to you? How do you define it? If you need to reflect on this for a while, that’s fine, you may hold onto this card and share when you’re ready. It’s also ok if this is something you need to reflect on for days or even weeks. “People may spend their whole lives climbing the ladder of success only to find, once they reach the top, that the ladder is leaning against the wrong wall.” -Thomas Merton. 1 point for drawing this card. All players are encouraged to think about their definition of success.", "Is there is an item or items that you rarely or never use, that could be useful to someone else? Maybe you could let a friend borrow your bicycle, or donate clothes you don’t wear? Any other ideas on how your “stuff” could be useful to someone else? 1 point for drawing this card.", "Can you think of a physical task you’ve been procrastinating? Mowing the lawn, cleaning the refrigerator, oiling the squeaky door, pulling the weeds, etc? One point to any player who commits to accomplishing a physical task.", "Give a gift, no matter how big or small. It could be anything from cookies you baked or flowers you picked, to a gift certificate or a drum set. One point to any player who commits to give a gift in the next 7 days after this game.", "What is one way technology helps you that you sometimes take for granted? Lights to read at night? A toaster that gives you perfect toast? Talking to people across the world for free? Hot running water? The heat or air conditioning in your home? Sometimes we forget how many things we have that didn’t even exist 50 or 100 years ago, and many people still do not have today. Remembering and being grateful for our good fortune can make life more enjoyable. Receive 1 point for drawing this card and sharing with the group. Any player is welcome to share.", "Do you have any obligation(s) that you need to free yourself from? Would this allow you to make time for other things which are more important to you, your hobby, rest, friends, or other opportunities? Time is your most precious resource, spend it wisely. 1 point for drawing this card and sharing. All players are welcome to share.", "Consider getting a plant for your home or workspace. This can be something as easy as a small potted cactus or other hearty plant, or you could plant a tree or flowers in your yard or a vacant lot. It’s a great way to beautify your surroundings and feel more at peace. 1 point for drawing this card, and one additional point to any player who commits to adding a plant to their surroundings.", "Moments of waiting, such as at traffic stop lights, “Don’t Walk” signs, waiting for an elevator, etc, can be great reminders and opportunities to practice gratitude or mindfulness. Could you use these “forced pauses” in your day to think of something you’re grateful for, or to focus on your breath and just be? What times in your day might be a good opportunity for you? 1 point for drawing this card. All players are welcome to share their thoughts.", "Could you send a photograph to a friend or relative to brighten their day? It could be to remind them of a good memory, or a picture you take today just for them. 1 point to any player who commits to sending a photo to someone to make them smile or laugh.", "What’s one of the most amazing or beautiful things you’ve ever seen? 1 point for drawing this card and sharing.", "What’s one of the most wonderful things you’ve ever smelled? 1 point for drawing this card and sharing.", "What’s one of the most beautiful or amazing things you’ve ever heard? 1 point for drawing this card and sharing.", "What’s one of the most wonderful things you’ve ever tasted? 1 point for drawing this card and sharing.", "What’s one of the most amazing physical sensations you’ve ever felt? 1 point for drawing this card and sharing.", "Think of a time you were excited to receive or acquire a physical object. What did it mean to you? How did it make you feel? 1 point for drawing this card and sharing.", "What is something you are accustomed to today, that would seem miraculous or magical to your grandparents when they were younger? And to your parents? 1 point for drawing this card and sharing. All players are welcome to share.", "What physical object have you desired and then successfully attained in the past? It could be from your childhood or just this week. Did you visualize having the item? Did you talk to others who had one? Did you look at pictures of it, read about it, go to the store and “window shop”? In other words, what were your strategies for success? 1 point for drawing this card and sharing.", "When was the last time you created something physical? What do you enjoy creating? Consider building a model, painting a room, creating a piece of art, a vision board, treehouse, fence, trail, piece of furniture, bike jump, sandcastle, hammock, whatever sounds fun and creative to you! 1 point for drawing this card and sharing. 1 additional point to any player who commits to creating something and finds an accountability partner.", "Consider creating something to make someone smile. It could be a drawing, food, card, sign, writing something on a friend’s car with window markers, etc. One point for drawing this card and one point to any player who commits to creating something to make someone smile.", "If you were a vehicle, what kind would you be? Why? 1 point for drawing this card and sharing, all players are welcome to share.", "What is one thing or experience you would like to have? What is one action you could take in the next 24 hours to move closer to your desire? The action does not need to be big or time consuming, it could be as simple as a few minutes of research, setting aside the first $10, or asking someone for help or advice. 1 point to any player who commits to taking an action toward their desire in the next 24 hours.", "What natural feature(s) in your surroundings do you enjoy? The shady tree in your yard, nearby lake, wildlife, hills, waterfall, etc? 1 point for drawing this card and sharing. All players are welcome to share.", "Create a positive message in public! Sidewalk chalk, car window markers, spray paint, paper flyers etc. can be a great way to create a positive message that other people will see. One point to the player drawing this card. One additional point to any player who commits to creating a positive message in public.", "What are your thoughts on “stuff”? Do you buy things to impress other people? Do you have many things that you rarely use? Do you prefer to buy new or used? Do you own your things or do your things own you? What do you think is a healthy relationship with stuff? 1 point for drawing this card and sharing. Other players may also share.", "What kind of art do you enjoy creating? When did you last create some sort of art? One point for drawing this card. One additional point to any player who commits to spending at least 30 minutes creating any sort of art.", "What is a current reality in your life that was once just a dream or goal? How did this become a reality? What does this mean to you? 1 point for drawing this card and sharing.", "If a movie was made about your life, who would play your character, and why? This can be any actor and at any age. 1 point for drawing this card and sharing.", "If there was a soundtrack to your life, what music would be on it, and why? This could be songs, artists, genres etc. 1 point for drawing this card and sharing.", "Can you remember a time when you were amazed by a new technology? This could be in your childhood or just yesterday. Your first email, voice recognition software, a levitating train, etc? We live in amazing times, and it’s interesting to think back on how far we’ve come. One point for drawing this card and sharing. All players are welcome to share.", "Are you in the daily habit of reading, watching or listening to inspiring thoughts? Zig Ziglar said that bathing and motivation don’t last, that’s why it’s recommended to do each daily. Any player may commit to a minimum of five minutes of inspiration per day for the next seven days, and receive one point.", "Are you familiar with the concept of a “mastermind group”? It is one of the most powerful tools you can use to improve your life. It can focus on business, health, spirituality, or it can include all aspects of members’ lives. This game is actually a form of a mastermind group. 1 point for drawing this card and sharing your thoughts or questions on the “mastermind group”. One additional point for any player who commits to spending at least 15 minutes learning about the concept of the mastermind group.", "What is money? Is it good? What is its purpose? What does it represent? 1 point for drawing this card and sharing.", "Do you ask for what you really want? Do you let the waiter seat you at a table you don’t like, or do you speak up? Do you tell your friend which movie you’d like to watch, or just let them pick? Asking for what you want can be done in a friendly way, and many times it’s easier than you think to get what you want. 1 point for drawing this card and sharing your thoughts.", "Do you have written goals? If so, receive one point for drawing this card. Any player may receive one point for writing down their goals daily for at least 21 days. Looking at your goals daily is great, but it’s been said that something magical that happens between your mind and your hand as you write them each day.", "Having a pen and paper by your bed is a useful habit. If you think of something you need to do, or have an idea while laying in bed, you can write it down and relax, knowing you won’t forget. Receive one point for drawing this card. Any player is welcome to share their thoughts.", "Consider making flash cards of some character traits you’d like to develop, such as “patient”, “confident”, “good listener”, “encouraging”, “outgoing” etc. Each morning draw a random card and practice that trait for the day. This can be a fun and effective exercise for growth. One point for drawing this card and one point to any player committing to creating and using these cards daily for at least 10 days."], "Body": ["What is something amazing that your body is automatically doing right now? One point for drawing this card and sharing. All players are welcome to share.", "What are a few amazing abilities that your body and mind have, that you don’t often think about? One point for drawing this card and sharing. All players are welcome to share.", "Do you read labels on the food you’re putting in your body? Do you know if the food you’re eating is full of sugar, artificial sweeteners, preservatives etc? If the player who drew this card is a regular label reader, they receive 1 point. Any player not in the habit of reading labels may receive one point for committing to reading the labels of the food at home and/or on your next trip to buy food.", "In this exercise, everyone closes their eyes and remain silent for 30 seconds. Notice every sound. Afterwards, see how many sounds the group can name. Did you miss anything that others heard? What does this exercise show us? 1 point for drawing this card.", "Stretch break for all players, 3 minutes minimum. A quick break can be a good chance to move, improve energy and alertness, get some needed water or fuel (nutritious food), or just clear your mind and relax. 1 point for drawing this card.", "A useful tip at the supermarkets is to primarily shop the perimeter of the store. In many stores, most of the healthy and “real” food tends to be located on the perimeter, while most processed and artificial foods tend to be in the interior aisles. 1 point for drawing this card.", "Are you well rested? Sufficient sleep helps with memory, mood, the immune system, and allows you to perform your best in work, relationships, sports, etc. If you feel that on a typical day, you are well rested, receive one point for drawing this card. Any player who feels they are often not well-rested, may commit to a sleep-related goal and receive 1 point. This goal could be a regular bedtime, a daily nap, no caffeine after 3pm, etc., and should have a specific time period.", "Are you getting enough water? Many people are often dehydrated without realizing it. Even mild dehydration can drain your energy and make you tired. From Mayo Clinic’s website: “(water) makes up about 60 percent of your body weight. Every system in your body depends on water. For example, water flushes toxins out of vital organs, carries nutrients to your cells..” If you drew this card and feel you generally drink plenty of water, receive one point. Any player may commit to a specific water-related goal for at least one week, and receive one additional point. This goal could be a daily minimum amount, carrying a water bottle with you to work, drinking water first thing each morning, etc.", "Do you have a strategy for dealing with stress? Taking a walk, listening to music, meditation, gardening, or a favorite game can help you relax and take your focus away from stressful thoughts . What works for you, and do you make time for it when needed? 1 point for drawing this card and sharing. All players are welcome to share.", "Do you keep healthy food easily accessible? It can be as easy as getting a bowl for the counter or table and filling it with various fruits and veggies, or keeping frozen berries/veggies in your freezer to easily add to your cereal, yogurt, rice etc. Another great habit is to keep water easily available, in a pitcher, by carrying a water bottle, etc. 1 point for drawing this card and sharing. One additional point for any player committing to make healthy food or water more easily available.", "Consider eating organic food, or as our grandparents called it, “food”. Consider supporting stores and markets carrying local organic food, that is not sprayed with pesticides, given hormones, shipped thousands of miles, etc. Remember, you vote with your wallet every time you buy. Support those who share your values. Receive one point for drawing this card. Any player may share their thoughts.", "If it’s ever a challenge for you to exercise consistently, consider these ideas; 1- What’s your “why”, or your purpose for exercising? Get clear, write it down. 2- Do something you find fun or soothing, a sport you enjoy with friends, walking in nature, taking your dog out, riding your bike etc. 3- Use the power of an accountability partner. Commit to meeting a workout partner or trainer at specific times. 4- Give yourself a goal and track your progress. These simple strategies can be very effective. What are your thoughts? 1 point for drawing this card and sharing.", "All players close their eyes and takes 3 slow, deep breaths. How do you feel? This is a great exercise when you are feeling stress or anxiety. Receive one point for drawing this card.", "Dial your next phone call, text message, or alarm code etc with your non-dominant hand. Any player may commit to this simple brain exercise and receive one point.", "Sit up straight or stand up straight and with a confident posture. How is your posture normally? Posture not only affects the impression you make on others, but how you feel and think about yourself. Players are welcome to share their thoughts. 1 point for drawing this card.", "One minute of silence. all players close their eyes for one minute with no talking. Think of your “happy place”, either real or imagined. Imagine it in detail, the sights, sounds, smells, tastes, every sensation, right down to the breeze and the clothes you’re wearing etc. 1 point for drawing this card.", "Brush your teeth with your non-dominant hand for one day. One point for drawing this card and committing to this brain exercise. Other players are encouraged to try the exercise, but receive no points.", "Scenario: You have all the time and money you will ever want, and must begin a road trip tomorrow. Where will you go, what will you do? What or who will you bring, what sort of vehicle will you take etc.? 1 point for drawing this card and sharing.", "Do you get enough quiet or alone time? Where and when? How important is it to you? If you need more quiet time, how can you make that happen? 1 point for drawing this card and sharing.", "What gifts did you receive for your last birthday or other holiday? Who did you spend time with that day? Which do you remember more clearly? What does this tell you? 1 point for drawing this card and sharing. All players are welcome to share.", "All players, close your eyes and imagine your perfect day for one minute. Where do you wake up, what’s the first thing you do? Who are you with, what do you eat? How do you feel? 1 point for drawing this card. Players may share if they wish.", "What drains your energy and enthusiasm or causes you stress? How can you eliminate, limit or replace this? You may reflect on this yourself, or share with the group. 1 point for drawing this card. All players are welcome to share.", "Who drains your energy and enthusiasm or causes you stress? How can you eliminate, limit or replace your interactions with this person? You may reflect on this yourself, or share with the group. 1 point for drawing this card. All players are welcome to share.", "If you could magically have one or several new skills or abilities this instant, what would you choose? Why? 1 point for drawing this card and sharing.", "Thomas Jefferson once said “We never repent of having eaten too little”, and Benjamin Franklin’s 1st virtue on his list of virtues to pursue was “Temperance. Eat not to dullness; drink not to elevation.” Do you sometimes eat or drink too much? What are your thoughts? 1 point for drawing this card, and one additional point to any player committing to a goal related to Franklin’s virtue of “temperance”.", "Ask yourself “How can I have fun doing the things I need to do today? (or tomorrow)” For example, can you add music, an audiobook, invite a friend, do a crossword or sudoku in the waiting room, make a game of an otherwise boring activity, make it a race, take a ball to toss around the office? What are your ideas? 1 point for drawing this card and sharing. All players are welcome to share.", "Many of us could benefit from some time spent in nature, whether a walk at a nearby park or longer trip further away from civilization. How do you enjoy time in nature? 1 point for the player drawing this card. One additional point to any player committing to spending some time in nature.", "How often do you take time to just go for a walk? Fresh air, movement, natural surroundings, birds chirping, all this is good for your body and mind. Even if it’s just a 5 or 10 minute walk around the block during a work break, you can see great results. So, grab the umbrella or the coat if you need to, and get moving. 1 point for drawing this card. One additional point for any player committing to go for a walk.", "It’s been said that laughter is the best medicine. What makes you laugh, and how often do you put yourself in situations to laugh? 1 point for drawing this card and sharing. Any player may receive one additional point for committing to doing something that makes them laugh in the next week, and receive 1 point. It could be as simple as looking at a favorite goofy website, hanging out with a funny friend, watching a favorite funny movie or show.", "Do you have a talent or skill you’d like to show the group? Can you juggle, wiggle your ears, do a one-arm pushup, crazy yoga pose, magic trick, weird hand puppet etc? Receive one point for drawing this card. Any player is encouraged to share their talent or skill.", "How has modern science and technology helped your body? Have you had a life-saving surgery, a repaired broken bone, or antibiotics to treat an infection? Do you wear glasses or contacts? Consider how we benefit from the work and ingenuity of countless doctors, scientists, and inventors. Receive one point for drawing this card, and any player who happens to be a doctor, nurse, scientist, or inventor, receives one point and a sincere thank you from this author.", "Do you have a “bed time”? It’s not only helpful for children. Having a consistent sleep schedule can help you fall asleep easily, rest more soundly, and be more energetic and productive the following day. Receive one point for drawing this card. One additional point to any player committing to a consistent bedtime for the next 7 days.", "How is your relationship with C.A.T.S. (Caffeine, Alcohol, Tobacco and Sugar)? These substances are readily available in our modern society, and many of us have room to improve here. Do you rely on any of them to alter your mood? Is there a change you’d like to make in this area? 1 point for drawing this card. One additional point to any player who commits to a specific improvement in this area over at least the next two weeks.", "Is there something you should do for your body? Maybe something you’ve been putting off? Should you get an eye exam, go to the dentist, get some new shoes or boots, schedule a doctor’s appointment? One point to any player committing to take an action to improve or maintain their body.", "Laughter relieves stress and helps you enjoy time with others. Remember a time when you or someone you were with laughed uncontrollably. 1 point for drawing this card and sharing. All players are welcome to share.", "How important to you is playing and fun? How often do you do it? George Bernard Shaw once said \"We don't stop playing because we grow old; we grow old because we stop playing.\" 1 point for drawing this card. One additional point to any player who commits to doing something fun. It could be anything from a squirt gun fight or ping pong to a prank phone call to a friend, whatever sounds fun to you!", "Do you spend much time sitting? If so, consider getting up every thirty minutes or so to stretch, move, do some pushups, juggle, whatever you like. It’s important to keep your body healthy, and will also help energize you and keep your mind sharp and alert. 1 point for drawing this card, and one additional point to any player committing to this practice for at least one week.", "What are your values and priorities regarding health? If you’re not sure, simply look at your choices, and they will show you. Do you choose to make time for rest and exercise? Do you choose nutritious food and drink to energize your body? Do you use effective strategies to avoid and deal with stress? Remember, if you ever wonder what your values are, simply look at your choices and actions. Is there anything you’d like to change? 1 point for drawing this card and sharing.", "What type of physical activity is fun for you? Finding recreation that you enjoy is a great way to stay consistently active. Basketball, dancing, biking, gardening, walking the dog, and swimming are all perfect examples. 1 point for drawing this card, and one additional point to any player who commits to doing a fun and healthy activity in the next 7 days.", "Physical activities benefit your mind as well as your body. Many of history’s great thinkers used long walks to stimulate their mind. And activities like juggling or stretching can help to refresh and reawaken your mind. Physical activity has also been shown to slow the aging process. Consider building movements like this into your daily routine. 1 point to any player committing to 10 minutes of mind-stimulating physical activity for each of the next 7 days.", "How is your sleep environment? Is it quiet, dark, and slightly cool? How could you improve it? One point for drawing this card. One additional point to any player committing to a specific improvement in their sleep environment.", "How do you want your body to feel one year from now? Will your current habits create this outcome? If you think they will, receive one point for drawing this card. Any player may commit to changing a habit that positively affects their body, maintaining the new habit for at least 3 weeks, and receive one point.", "Do you get enough fresh air, natural light, and sunshine each day? These can all help improve your mood, alertness, and overall health. What can you do to improve in this area? 1 point for drawing this card and sharing. One additional point to any player committing to a specific improvement in this area for at least one week."], "Heart": ["It’s “Gratitude Time”. When you notice the time is a repetitive number such as 11:11, 10:10, 3:33, 4:44 etc., use it as a reminder or “trigger” to think of what you are grateful for. It’s an easy habit to form, and focusing on gratitude is one of the most proven paths to a more fulfilling life. All players are encouraged to say at least three things they’re grateful for. 1 point for drawing this card. If the clock strikes a “gratitude time” during this game, each player may say three things they’re grateful for and receive one point.", "What went well today? A great habit to form is, each night, ask yourself “What went well today?”, and name at least three things. You can combine this with another habit, like brushing your teeth, to help you remember, or put a note on your mirror, etc. Tell the group what went well today so far, and receive 1 point. Any player may receive 2 additional points if you commit to do this each evening for one week.", "Consider putting inspiring quotes where you will see them daily. On your mirror, your door, your computer monitor, your car’s dashboard or sun visor. You can even write them directly on the wall in pencil and add to them whenever you’re inspired. Any player may commit to post quotes within one week and receive one point.", "The “gratitude game” is a quick and simple game you can play any time. Let’s play now. Share one thing you’re grateful for, then each other player quickly shares in a clockwise direction until each player has shared three times. 1 point for drawing this card.", "Ready to feel great? You receive a compliment, high five, hug, words of encouragement, smile, handshake or pat on the back from every player! And you even receive 1 point in the process! Notice how you feel. How could you use these actions to uplift those around you more often?", "Think of a past victory, success, accomplishment or comeback you’ve experienced. Share with the group and receive one point.", "Write down at least 3 of your own strengths. Every other player also writes down at least one strength they see in you. Share your list first, then each other players share the strengths they see in you. One point for drawing this card and sharing.", "Share a favorite memory involving family, and receive one point.", "Share a favorite childhood memory, and receive one point.", "Share a favorite memory involving travel, and receive one point.", "Share a favorite memory of overcoming a challenge, and receive one point.", "Share a favorite memory of success or recognition, and receive one point.", "Share a favorite memory involving money, and receive one point.", "Share a favorite memory involving work or coworkers, and receive one point.", "Share a favorite memory involving school, and receive one point.", "Share a favorite memory involving a friend or friends, and receive one point.", "Share a favorite memory involving family or friends, and receive one point.", "Share a favorite memory involving a pet or other animal and receive one point.", "Tell the group about one of your favorite places. It could be a park, a city, your front porch, a swimming hole, your garden, etc. What is it about this place that makes it special? One point for drawing this card and sharing.", "Music is a powerful tool we can use to help manage our mood. How and when do you listen to music, and how does it affect you? One point for drawing this card and sharing.", "Exercise: The player drawing this card will read an incomplete sentence, and every player will finish the sentence silently in their mind. Ready? Here we go: “I am _______”. What was your first thought? Is this what you want to believe at a subconscious level? If not, look into “affirmations” and how to create and use them to reprogram your mind. A great resource on this topic is Jack Canfield’s book “The Success Principles”. 2 points to any player who commits to creating an affirmation containing “I am”, and repeating it with emotion at least ten times daily for 30 days.", "Exercise: The player drawing this card will read an incomplete sentence, and every player will finish the sentence silently with the first thought that comes to mind. Does everyone understand? Ready?: “Life is _______”. What was your first thought? Is this what you want to believe at a subconscious level? If not, look into “affirmations” and how to create and use them to reprogram your mind. A great resource on this topic is Jack Canfield’s book “The Success Principles”. 2 points to any player committing to creating an affirmation and repeating it at least ten times daily for 30 days.", "Exercise: The player drawing this card will read an incomplete sentence, and every player will finish the sentence silently with the first thought that comes to mind. Does everyone understand? Ready?: “Challenge is _______”. What was your first thought? Is this what you want to believe at a subconscious level? If not, look into “affirmations” and how to create and use them to reprogram your mind. A great resource on this topic is Jack Canfield’s book “The Success Principles”. 1 point for drawing this card. 1 additional point to any player committing to creating an affirmation and repeating it at least ten times daily for 30 days.", "What is beautiful that you can see right now and hadn’t really noticed? There is always beauty around us, but it’s up to us to notice it. 1 point for drawing this card and sharing.", "How important is quiet alone time to you? Where, and when do you get it? Do you get enough of it? If not, how could you? 1 point for drawing this card and sharing. 1 additional point for any player committing to at least 30 minutes of quiet alone time.", "If you are currently working, studying, volunteering etc, what is your current field of endeavor, and how did you become involved in it? What about this work, study, etc do you find interesting or rewarding? 1 point for drawing this card and sharing.", "What work or accomplishment has been particularly meaningful or fulfilling for you? Why? 1 point for drawing this card and sharing.", "Remember a time you felt “butterflies in your stomach”? Did you like it? What do butterflies mean to you? 1 point for drawing this card and sharing.", "What is one of your greatest achievements to date? What made you successful? Did you have help? What did you learn from the experience? Receive 1 point for sharing.", "If you were to write your autobiography, what would one of the chapters be about? What was an important time of transition in your life? 1 point for drawing this card and sharing.", "Do you have a “bucket list” of things you want to do in your lifetime? If so, would you like to tell the group something on the list? 1 point for drawing this card and sharing. 1 additional point to any player committing to creating or expanding their bucket list, or for completing an experience on the list!", "How do you relax and quiet your mind? What do you do, where do you go? Do you make time for this on a regular basis? If not, how could you? All players are welcome to share. 1 point to the player drawing this card.", "Exercise: Who are you? The player to your right asks you “Who are you?” 10 times. Each time, give them a different answer. After you have finished, reflect on this exercise, what you thought during it, and what that means to you. You may share if you wish. Receive 1 point for completing the exercise.", "What do you stand for? All players are encouraged to think about this, and may share if they wish. The player drawing this card receives one point.", "Ask yourself, “How can I be a force for good in this world? How can I make a positive difference, no matter how big or small?” 1 point for drawing this card and sharing. All players are encouraged to consider this question, and are welcome to share with the group.", "Think of a challenging time or difficult experience that resulted in making you a stronger or better person. Sometimes we judge situations as “bad”, not realizing they may lead to valuable growth and learning. Remembering this may help make your next challenge a bit easier to deal with. 1 point for drawing this card. All players are welcome to share a challenging but beneficial experience.", "Which values or virtues are important to you? Some examples are: service, justice, adventure, growth, compassion, understanding, patience, generosity, honesty, etc. All players write down five values they believe are important. 1 point for drawing this card. All players are welcome to share their thoughts.", "‘'Never give up on what you really want to do. The person with big dreams is more powerful than one with all the facts.'’ -H. Jackson Brown Jr. What do you think about this quote? Should one be “realistic” or follow their dreams? Or is it possible to do both? 1 point for drawing this card. Any player is welcome to share.", "Do you volunteer? Giving to others is one of the most reliable paths to feeling more fulfilled. You could help coach a sports team, serve at a local shelter, visit a nursing home, help a relative in need, clean up a local beach or park. And you will often meet great people in the process. Many opportunities can be found online. You can even create your own event and invite your friends and others on social media sites. 1 point to any player who has volunteered within the last three months, and 2 points to any player who commits to volunteer within the next 30 days.", "Do you have a gratitude journal? Consider creating a journal in which you record your gratitude daily. It can be a great exercise first thing in the morning or just before bed. You can use a physical journal or a document on your computer or phone. The habit of focusing on what you are thankful for is one of the most effective ways to feel more fulfilled. 1 point to the player drawing this card, and one additional point to any player committing to keeping a gratitude journal for the next 7 days or more.", "What does greatness mean to you? Who is great? 1 point for drawing this card and sharing. All players are welcome to share.", "What does courage mean to you? Who is courageous? 1 point for drawing this card and sharing. All players are welcome to share.", "What does compassion mean to you? Who is compassionate? 1 point for drawing this card and sharing. All players are welcome to share.", "How do you feel when you see others succeed? 1 point for drawing this card and sharing. All players are welcome to share.", "What gives you hope? 1 point for drawing this card and sharing. All players are welcome to share.", "How do you feel about pets? Do you have one? 1 point for drawing this card and sharing. All players are welcome to share.", "What is one way the world is better with you in it? 1 point for drawing this card and sharing.", "What are you grateful for? All players take a few moments to write down at least three things you’re grateful for. One point for drawing this card.", "How do you think and talk to yourself? Would you speak like this to another person you love? If someone spoke to you this way, would you want them as a friend? 1 point for drawing this card. Any player is welcome to share.", "How is your “self-talk”. Would you say to others, the things you tell yourself? What do you say to yourself about your mistakes, perceived shortcomings or “weak spots”? Is your self-talk empowering, are there ways you could improve it? One point for drawing this card and sharing. One additional point to any player who posts a reminder to be more conscious of their self-talk for at least one week.", "What advice would you give yourself at six years old? 1 point for drawing this card and sharing.", "What advice would you give yourself at 12 years old? 1 point for drawing this card and sharing.", "What advice would you give yourself at 18 years old? 1 point for drawing this card and sharing."], "People": ["Who are your role models? Watching and learning from people who have traits or skills that you’d like to emulate can be very valuable. Remember, a person need not be perfect to be a good role model. One person may be a great role model for having a happy marriage, while another may set a great example in physical fitness or running a business. You can even learn from the mistakes of others, and avoid repeating them. 1 point for drawing this card and sharing about at least one of your role models.", "Give a sincere compliment to someone at the table and receive 1 point. It could be a quality or skill you admire, something about their physical appearance, their accomplishments, or anything else.", "Mentors can have a powerful impact on our lives. Who was a mentor to you, and how? Is there an area of your life in which you could use a mentor now? If so, where might you find one? 1 point for sharing drawing this card and sharing. All players are encouraged to share.", "Who was one of your heroes while growing up? It could be a real person or a fictional character. Why did you admire them? Who is a hero of yours now? Why? 1 point for drawing this card and sharing. All players are welcome to share.", "It’s been said that holding onto anger is like holding onto a hot coal and expecting the other person to get burned. People sometimes make mistakes, act selfishly, and hurt others. Remember that everyone is doing the best they can with what they know. Anger cannot change the past, it does not help anyone. If you feel angry sometimes, don’t worry, it just means you’re human. Let the anger fade away as soon as you’re able to. Life is short, enjoy it. 1 point to the player drawing this card. 2 additional points to any player who commits to writing a sincere letter of forgiveness, whether the letter is sent or not.", "Are you a good listener? Ask everyone at the table to tell you something that is important to them, or something you don’t know about them. Say only “thank you ” in reply. You may have to resist the urge to blurt out your opinion or related experiences. Learning to listen and let others have the spotlight is a valuable social skill, and one this author needs to work on :) 1 point for drawing this card and completing this exercise.", "This exercise is to be completed in private later. What five people do you spend most of your time with? Make a list. Give each person a score of 1 to 10, with 1 being most negative and 10 most positive, based on how they affect your thinking, energy, mood, etc. For anybody less than a 6, ask yourself if you need to spend time with them, and if so, how can you limit this time? For anyone scoring 8 or higher, how can you spend more time with them? Any player may receive 1 point for committing to completing this exercise within 24 hours.", "Who are you grateful to and why? 1 point for drawing this card and sharing. 1 additional point for any player committing to writing a letter of appreciation or gratitude. It can be sent via email, snail mail, or even read to them in person or over the phone.", "Giving compliments is an easy way to brighten someone’s day, and it makes you feel great as well. Give a sincere compliment to another player and receive 1 point.", "Many of us have been fortunate to have wonderful mentors. They may have been teachers, coaches, employers, family friends etc. How could you give back? Is there someone you could help to guide? Mentoring others can be very rewarding for both the mentor and the pupil. Receive one point for drawing this card.", "Gossip can not only be hurtful to the person being gossiped about, but will often make positive people choose to not be around you. It will also make the people you gossip to wonder if you also gossip about them. This makes you a difficult person to trust. Consider striving to only say things about people that you would be willing to say if they were present. How do you feel about gossip? Receive one point for drawing this card and sharing.", "Give a gift to a stranger. It could be flowers, chocolate, tickets etc to someone you pass on the sidewalk, a nurse, teacher, waiter, or volunteer, use your imagination! You can give the person a reason that you picked them, or let it remain a mystery. You could even leave it when they’re not looking. However you do it, you’ll both feel good. 1 point to any player committing to giving a gift to a stranger.", "Who do you admire? Why? Have you told them? 1 point for drawing this card and sharing with the group. 1 additional point to any player who commits to telling a person they admire why they admire them, in person, by letter, email or phone.", "How often do you smile at people you don’t know? The bus driver, your waitress, the people you walk by on the sidewalk? How often do you smile at people you do know, your co-workers, family, etc? How could it change the world if we all smiled a little more often? Receive one point for drawing this card and sharing. One additional point to any player committing to smiling at 3 strangers in the next 24 hours.", "If you could spend 30 minutes with a hero, still living or not, who would it be, and what would you talk about? 1 point for drawing this card and sharing.", "If you knew you had exactly five years left to live, what would you do differently? If it was one year? Three months? How long do you have left to live? Yes, that is a trick question. What are your thoughts? 1 point for drawing this card and sharing with the group.", "How would you least like others to perceive you? How would most like others to perceive you? Why? How much control do you have over others’ perception of you? 1 point for drawing this card and sharing with the group.", "When you’re talking with others, do you need to be right? Are you able to admit when you’re wrong, or say “I don’t know”? For some of us, admitting we’re wrong can be a challenge. But this ability can improve relationships, and save you the stress of trying to prove yourself right. Nobody is right all the time, yes, even you :) Receive one point for drawing this card and sharing.", "If you could instill one virtue or value in the next generation, what would it be? Why? 1 point for drawing this card and sharing.", "Do you remember a time during your childhood when an adult did something kind for you? What could you do to brighten a child’s day? 1 point for drawing this card and sharing. 1 additional point to any player committing to doing something kind for a child.", "How do you feel about failure and mistakes? What would be an empowering belief about failure and mistakes? Some examples of empowering beliefs are “With every mistake I learn and improve”, “Failure is an event, not a person”, “All excellence comes from many attempts and mistakes”, “You’re only a failure if you quit” etc. If you study the lives of your heroes you will see that many failures, mistakes and setbacks occur on the path to success. 1 point for drawing this card and sharing. All players are welcome to share their thoughts.", "What’s a challenge you’re facing, or something you’d like to change in your life? Who is capable of helping you? What is one action you could take in the next 24 hours to improve this situation? Receive one point for drawing this card and sharing. Any player may receive one additional point for committing to one action in the next 24 hours.", "Thomas Jefferson once said \"When angry, count to ten before you speak. If very angry, count to one hundred.\" Have there been times when this would have been helpful to you? Can you use this or a similar technique, such as taking several deep breaths, to calm yourself before responding? 1 point for drawing this card and sharing. All players are welcome to share.", "Do you sometimes catch yourself judging others, or gossiping behind their back? The next time you are tempted to gossip, your challenge is to remind yourself that people are doing the best they can with the experience and knowledge they have. Nobody wakes up in the morning and says “Today I’m going to be the worst person I can be.” 1 point for drawing this card and sharing. All players are welcome to share.", "When your amazing ride on Spaceship Earth is over, what would you like to be remembered for? Share with the group and receive 1 point.", "Are you a good listener? Do you find it easy to listen as much as you talk? If you answered “yes”, receive one point for drawing this card. Any player who answered “no” may commit to making a conscious effort to be a better listener for one week, and receive two points.", "How can you add value to others’ lives? How do you already add value to others’ lives? After you’ve shared, other players are welcome to share how they think you add value to others. Receive one point for drawing this card and sharing.", "How can you “make someone’s day” in the next week? It could be an act of service, words of encouragement, a letter, email or voicemail, a gift, setting aside some quality time, etc. Any player may receive 2 points for committing to an action intended to “make someone’s day”.", "What is one important thing you learned from your parents? If you were not close with your parents, what is one thing you learned from another role model, teacher, coach, etc. Receive one point for drawing this card and sharing.", "How often do you say “please”, “thank you”, “you’re welcome”, “excuse me” etc? How do you feel when others say these things or show good manners in other ways? 1 point for drawing this card and sharing.", "Do you hold doors open for others? Could taking a few seconds to hold a door and give a sincere smile help to brighten someone’s day? 1 point for drawing this card and sharing. 1 additional point to any player committing to holding a door for others at least ten times. You may find yourself creating a new habit that will make you and other people feel good.", "Do you have something you borrowed that you were supposed to return already? If not, receive 1 point for drawing this card. Any player may receive one point for committing to return something they’ve borrowed.", "Have you made a promise or agreement that you haven’t fulfilled? How important do you feel it is to keep your word? 1 point to the player drawing this card if you can’t think of an unfulfilled promise. 1 point for any player who commits to fulfill a promise as soon as possible.", "Is there someone who deserves a thank you note from you? A friend, neighbor, teacher, your mom, dad, brother or sister? It could be as simple as an email or text message, or could be a fancy card and flowers. 1 point to any player committing to write a thank you note to someone deserving.", "Do you owe anyone an apology? We sometimes let pride get the best of us. Having the strength to admit you were wrong and sincerely apologize is a courageous act. In the words of the Dr. Wayne Dyer: “When you're in the middle of an argument, ask yourself: Do I want to be right, or do I want to be happy?” 1 point for drawing this card and sharing. One additional point to any player committing to making a sincere apology.", "What is one nice thing you can do for yourself within the next 24 hours? 1 point to any player committing to doing something nice for themselves within 24 hours. It could be as simple as a hot bath, a favorite meal, or taking some time to read or watch your favorite team. Enjoy!", "Commit an act of kindness... anonymously. Do it for the satisfaction of knowing you helped someone, not for recognition. Get an accountability partner, but don’t report to them what you do, only report that you have completed your anonymous kind act. 1 point to any player committing to an anonymous act of kindness.", "As much as it’s in your control, don’t spend your limited time and energy engaging and arguing with your critics, “haters” and “trolls”. Everyone doing anything significant will have critics. Remember, it’s been said that “There has never been a statue erected to honor a critic.” How do you ignore or deal with critics in an empowering way? 1 point for drawing this card. Any player may share their thoughts.", "The gift of giving. Select two other players who each receive 1 point in the category of their choice. The player you select must simply say “thank you” and sm
