const CATS={H:{name:'Heart',v:'--H'},M:{name:'Mind',v:'--M'},B:{name:'Body',v:'--B'},P:{name:'People',v:'--P'},T:{name:'Tangibles',v:'--T'}};
const KEYS=['H','M','B','P','T'];
const SITE_URL='https://bettermegame.com/play.html';
const MAXP=8;
/* OFFLINE (made from cards-master.csv) = cards not dealt right now. Players who hearted one still get it. */
const cardId=(c,i)=>c+i;
const col=c=>`var(${CATS[c].v})`;
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const JOINABLE=/all players|any player|everyone at the table|other players|each player/i;
const APART=/close (your|their) eyes|one minute|1 minute|write down|at the table|smile at the other|clockwise|every player|show the group/i;

let fs=null,me=null,myName='';
let gid=null,game=null,myGames=[],posts=[],sugg=[],cardStats={};
let unGame=null,unPosts=null,busy=false,ui={joinOpen:null,commitOpen:false,pts:1,msg:'',suggOpen:false,editName:false};

function lsGet(k){try{return localStorage.getItem(k)||''}catch(e){return ''}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function cardText(c,i){const d=DECKS[c];return d&&d[i]!=null?d[i]:'(card not found)'}
function others(){return game?game.players.filter(p=>p!==me):[]}
function nameOf(id,g){g=g||game;if(g&&g.names&&g.names[id])return g.names[id];for(const x of myGames){if(x.names&&x.names[id])return x.names[id]}return 'Player'}
function nm(id,g){return id===me?'You':nameOf(id,g)}
function scores(list){
  const s={};(game?game.players:[]).forEach(p=>s[p]={H:0,M:0,B:0,P:0,T:0});
  (list||posts).forEach(x=>{if(s[x.by]&&x.cat&&x.pts>0)s[x.by][x.cat]+=x.pts});
  /* Points beyond the target don't count: a full category is simply full. */
  const t=game?game.target:3;Object.values(s).forEach(o=>KEYS.forEach(k=>{o[k]=Math.min(o[k],t)}));
  return s;
}
function fulfilledCount(sc){return KEYS.filter(k=>sc[k]>=game.target).length}
function curPlayer(){return game&&game.players[game.turn%game.players.length]}
function myTurn(){return game&&game.status==='playing'&&curPlayer()===me}
function newId(){const a='abcdefghijkmnpqrstuvwxyz23456789';let s='';const r=new Uint32Array(12);crypto.getRandomValues(r);r.forEach(n=>s+=a[n%a.length]);return s}
function show(h){$('#main').innerHTML=`<section class="panel">${h}</section>`}

/* ---------- boot ---------- */
async function boot(){
  if(!FIREBASE_CONFIG||!window.firebase){show(`<h2>Almost ready</h2><p class="muted">The online game is being set up. Check back soon.</p>`);return}
  firebase.initializeApp(FIREBASE_CONFIG);fs=firebase.firestore();
  try{const cred=await firebase.auth().signInAnonymously();me=cred.user.uid}
  catch(e){show(`<h2>Can't connect</h2><p class="muted">Check your internet connection and reload the page.</p>`);return}
  myName=lsGet('bm_name');
  window.addEventListener('hashchange',route);
  fs.collection('games').where('players','array-contains',me).onSnapshot(s=>{myGames=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  fs.collection('cards').onSnapshot(s=>{const o={};s.docs.forEach(d=>o[d.id]=d.data());cardStats=o;render()},()=>{});
  fs.collection('suggestions').orderBy('at','desc').limit(200).onSnapshot(s=>{sugg=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  route();
}
function route(){
  const h=(location.hash||'').replace(/^#/,'');
  const next=/^[a-z0-9]{8,20}$/.test(h)?h:null;
  if(next===gid&&(unGame||!next)){render();return}
  gid=next;game=null;posts=[];ui.joinOpen=null;ui.commitOpen=false;ui.pts=1;ui.msg='';
  if(unGame)unGame();if(unPosts)unPosts();unGame=unPosts=null;
  if(gid){
    unGame=fs.collection('games').doc(gid).onSnapshot(s=>{game=s.exists?Object.assign({id:s.id},s.data()):false;render()},()=>{game=false;render()});
    unPosts=fs.collection('games').doc(gid).collection('posts').orderBy('at','asc').onSnapshot(s=>{posts=s.docs.map(d=>Object.assign({id:d.id},d.data()));render()},()=>{});
  }
  render();
}
function openGame(id){location.hash=id?id:'home'}

/* ---------- actions ---------- */
async function act(fn){if(busy)return;busy=true;ui.msg='';try{await fn()}catch(e){console.error(e);ui.msg='That didn’t save. Check your connection and try again.'}busy=false;render()}
const G=()=>fs.collection('games').doc(gid);
const POSTS=()=>fs.collection('games').doc(gid).collection('posts');

async function saveName(){
  const v=(($('#myname')||{}).value||'').trim().slice(0,30);
  if(!v){ui.msg='Type a first name so friends know it’s you.';return}
  myName=v;lsSet('bm_name',v);ui.editName=false;
  for(const g of myGames){if(g.names&&g.names[me]!==v)await fs.collection('games').doc(g.id).update({['names.'+me]:v})}
}
async function newGame(){
  const id=newId();
  const name=((($('#newname')||{}).value)||'').trim().slice(0,60)||(myName+'’s game');
  await fs.collection('games').doc(id).set({name,status:'lobby',players:[me],names:{[me]:myName},host:me,target:2,turn:0,pending:null,saved:{},firsts:{},winner:null,createdAt:Date.now(),lastMoveAt:Date.now()});
  openGame(id);
}
async function joinGame(){
  if(!game||game.status!=='lobby'||game.players.includes(me)||game.players.length>=MAXP)return;
  await G().update({players:firebase.firestore.FieldValue.arrayUnion(me),['names.'+me]:myName});
}
async function startGame(target){
  if(game.host!==me)return;
  const order=game.players.slice();for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]]}
  await G().update({status:'playing',players:order,target,turn:0,lastMoveAt:Date.now()});
}
async function removePlayer(id){
  if(game.host!==me||id===me||game.status!=='lobby')return;
  await G().update({players:game.players.filter(p=>p!==id)});
}
function hearts(c,i){const s=cardStats[cardId(c,i)];return (s&&s.hearts)||[]}
function iHeart(c,i){return hearts(c,i).includes(me)}
function inMyDeck(c,i){return !(OFFLINE[c]||[]).includes(i)||iHeart(c,i)}
async function toggleHeart(c,i){
  const FV=firebase.firestore.FieldValue;
  await fs.collection('cards').doc(cardId(c,i)).set({hearts:iHeart(c,i)?FV.arrayRemove(me):FV.arrayUnion(me)},{merge:true});
}
function heartBtn(c,i){
  if(c==null||i==null)return '';const n=hearts(c,i).length;const on=iHeart(c,i);
  return `<button class="small heart ${on?'on':''}" data-act="heart" data-arg="${c}:${i}" aria-pressed="${on}" title="${on?'You love this card':'Love this card'}">${on?'♥':'♡'} ${n}</button>`;
}
function pickIdx(cat){
  const used=new Set(posts.filter(p=>p.cat===cat&&p.idx!=null).map(p=>p.idx));
  const all=DECKS[cat].map((_,i)=>i).filter(i=>inMyDeck(cat,i));let free=all.filter(i=>!used.has(i));if(!free.length)free=all;
  return free[Math.floor(Math.random()*free.length)];
}
async function spin(){
  if(!myTurn()||game.pending)return;
  const cat=KEYS[Math.floor(Math.random()*5)];
  if(scores()[me][cat]>=game.target)await G().update({pending:{choose:true,why:'wild',from:cat}});
  else await G().update({pending:{cat,idx:pickIdx(cat)}});
}
async function choose(cat){
  const p=game.pending;if(!myTurn()||!p||!p.choose)return;
  await G().update({pending:{cat,idx:pickIdx(cat)}});
}
async function playSaved(i){
  if(!myTurn()||game.pending)return;
  const mine=((game.saved||{})[me]||[]).slice();const c=mine.splice(i,1)[0];if(!c)return;
  await G().update({pending:{cat:c.cat,idx:c.idx,fromSaved:true},['saved.'+me]:mine});
}
function nextTurnPatch(){return {turn:(game.turn+1)%game.players.length,pending:null,lastMoveAt:Date.now()}}
function checkEnd(list){
  const sc=scores(list);const firsts=Object.assign({},game.firsts||{});const newly=[];
  game.players.forEach(p=>KEYS.forEach(k=>{if(sc[p][k]>=game.target&&!firsts[k]){firsts[k]=p;newly.push({p,k})}}));
  return {firsts,newly,winners:game.players.filter(p=>fulfilledCount(sc[p])===5)};
}
function readCommit(){
  if(!ui.commitOpen)return null;
  const t=($('#c_text')||{}).value||'',partner=($('#c_partner')||{}).value||'',due=($('#c_due')||{}).value||'';
  if(!t.trim()){ui.msg='Write what you’re committing to, or untick the commitment box.';return false}
  return {text:t.trim().slice(0,500),partner,due,done:false};
}
/* Each card's points come from the master card list: [for sharing, extra for a commitment]. */
function ptsLimit(c,i){const v=(typeof PTS!=='undefined'&&PTS[c]&&PTS[c][i])||[1,0];return {share:v[0],commit:v[1]}}
function ptsMax(lim){return lim.share+(ui.commitOpen?lim.commit:0)}
function syncPts(p){
  const key=p.cat+p.idx;const lim=ptsLimit(p.cat,p.idx);
  if(ui.ptsFor!==key){ui.ptsFor=key;ui.pts=lim.share}
  ui.pts=Math.max(0,Math.min(ptsMax(lim),ui.pts));
}
async function postAnswer(){
  const p=game.pending;if(!myTurn()||!p||p.choose)return;
  syncPts(p);
  const post={by:me,cat:p.cat,idx:p.idx,text:((($('#ans')||{}).value)||'').trim().slice(0,4000),pts:ui.pts,kind:'turn',at:Date.now()};
  const c=readCommit();if(c===false)return;if(c)post.commit=c;
  await POSTS().add(post);
  const r=checkEnd(posts.concat(post));
  if(r.winners.length)await G().update({status:'over',winner:r.winners[0],pending:null,lastMoveAt:Date.now()});
  else await G().update(nextTurnPatch());
  ui.pts=1;ui.ptsFor=null;ui.commitOpen=false;
}
async function passCard(){
  const p=game.pending;if(!myTurn()||!p||p.choose)return;
  await POSTS().add({by:me,cat:p.cat,idx:p.idx,text:'',pts:0,kind:'pass',at:Date.now()});
  await G().update(nextTurnPatch());
}
async function saveCard(){
  const p=game.pending;if(!myTurn()||!p||p.choose)return;
  const mine=((game.saved||{})[me]||[]).concat({cat:p.cat,idx:p.idx});
  await POSTS().add({by:me,cat:p.cat,idx:null,text:'',pts:0,kind:'saved',at:Date.now()});
  await G().update(Object.assign({['saved.'+me]:mine},nextTurnPatch()));
}
async function joinIn(parentId){
  const parent=posts.find(x=>x.id===parentId);if(!parent)return;
  const text=(($('#j_'+parentId)||{}).value||'').trim();const pts=+(($('#jp_'+parentId)||{}).value||1);
  const post={by:me,cat:parent.cat,idx:parent.idx,text:text.slice(0,4000),pts,kind:'join',parent:parentId,at:Date.now()};
  await POSTS().add(post);
  const r=checkEnd(posts.concat(post));
  if(r.winners.length)await G().update({status:'over',winner:r.winners[0],pending:null});
  ui.joinOpen=null;
}
async function markDone(postId){
  const p=posts.find(x=>x.id===postId);if(!p||p.by!==me||!p.commit||p.commit.done)return;
  await POSTS().doc(postId).update({'commit.done':true,'commit.doneAt':Date.now()});
  const kept={by:me,cat:p.cat,idx:null,text:p.commit.text,pts:1,kind:'kept',parent:postId,at:Date.now()};
  await POSTS().add(kept);
  const r=checkEnd(posts.concat(kept));
  if(r.winners.length)await G().update({status:'over',winner:r.winners[0],pending:null});
}
async function skipTurn(){if(!game||game.host!==me||game.status!=='playing')return;await G().update(nextTurnPatch())}
async function endNow(){
  if(!game||game.status!=='playing'||game.host!==me)return;
  const sc=scores();const tot=p=>KEYS.reduce((a,k)=>a+sc[p][k],0);
  await G().update({status:'over',winner:game.players.slice().sort((a,b)=>tot(b)-tot(a))[0],pending:null,endedEarly:true,lastMoveAt:Date.now()});
}
async function addSuggestion(){
  const text=(($('#s_text')||{}).value||'').trim();const topic=($('#s_topic')||{}).value||'Rules';
  if(!text){ui.msg='Write your suggestion first.';return}
  const s={by:me,name:myName,text:text.slice(0,2000),topic,at:Date.now(),plus:[]};
  const p=game&&game.pending;if(($('#s_card')||{}).checked&&p&&p.cat)Object.assign(s,{cat:p.cat,idx:p.idx});
  await fs.collection('suggestions').add(s);
  const e=$('#s_text');if(e)e.value='';ui.msg='Thanks! Your suggestion is saved.';ui.suggOpen=true;
}
async function plusOne(id){
  const s=sugg.find(x=>x.id===id);if(!s||s.by===me)return;
  const FV=firebase.firestore.FieldValue;
  await fs.collection('suggestions').doc(id).update({plus:(s.plus||[]).includes(me)?FV.arrayRemove(me):FV.arrayUnion(me)});
}
function copyText(txt,okMsg,fallbackId){
  navigator.clipboard.writeText(txt).then(()=>{ui.msg=okMsg;render()},()=>{const e=$('#'+fallbackId);if(e)e.select();ui.msg='Copy this: '+txt;render()});
}

/* ---------- render ---------- */
function render(){
  const keep=snapshotInputs();
  $('#main').outerHTML=`<div id="main" style="display:contents">${view()}</div>`;
  restoreInputs(keep);
}
function snapshotInputs(){const o={};document.querySelectorAll('#main textarea,#main input,#main select').forEach(e=>{if(e.id)o[e.id]=e.type==='checkbox'?e.checked:e.value});const a=document.activeElement;o.__focus=a&&a.id;return o}
function restoreInputs(o){Object.keys(o).forEach(k=>{if(k==='__focus')return;const e=document.getElementById(k);if(e){if(e.type==='checkbox')e.checked=o[k];else e.value=o[k]}});if(o.__focus){const e=document.getElementById(o.__focus);if(e)e.focus()}}

function view(){
  const msg=ui.msg?`<div class="note warn">${esc(ui.msg)}</div>`:'';
  if(!myName||ui.editName)return msg+nameBox();
  const who=`<div class="spread small muted"><span>Playing as <b style="color:var(--fg)">${esc(myName)}</b></span><button class="link" data-act="editname">Change name</button></div>`;
  if(!gid)return msg+who+home()+suggestBox()+rulesBox();
  if(game===null)return msg+`<section class="panel"><p class="muted">Loading the game…</p></section>`;
  if(game===false)return msg+`<section class="panel"><h2>Game not found</h2><p class="muted">Check the link, or ask your friend to send it again.</p><div class="row"><button data-act="home">My games</button></div></section>`;
  const bar=`<div class="spread"><button class="link" data-act="home">← My games</button><h2>${esc(game.name||'Game')}</h2></div>`;
  if(game.status==='lobby')return msg+who+bar+lobby()+rulesBox()+suggestBox();
  if(game.status==='over')return msg+who+bar+commitsPanel()+scoreboard()+feed()+suggestBox()+rulesBox();
  return msg+who+bar+scoreboard()+turnPanel()+commitsPanel()+feed()+suggestBox()+rulesBox()+hostBox();
}
function nameBox(){
  return `<section class="panel"><h2>${myName?'Change your name':'Welcome! What’s your first name?'}</h2>
  <p class="muted">That’s all you need. No account, no password.</p>
  <div class="row"><div class="field" style="flex:1;min-width:200px"><label for="myname">Your name</label><input id="myname" maxlength="30" value="${esc(myName)}" placeholder="e.g. Russell" autocomplete="given-name"></div>
  <button class="primary" data-act="savename" style="align-self:flex-end">${myName?'Save':'Let’s play'}</button></div>
  <p class="small muted">This device remembers you. Playing on another phone or computer? Use the same name.</p></section>`;
}
function statusLine(g){
  if(g.status==='lobby')return `Waiting for players (${g.players.length}/${MAXP})`;
  if(g.status==='over')return `Finished · ${esc(nm(g.winner,g))} won`;
  const cur=g.players[g.turn%g.players.length];
  return cur===me?'<b style="color:var(--fg)">Your turn!</b>':`Waiting for ${esc(nm(cur,g))}`;
}
function home(){
  const rank=g=>g.status==='playing'&&g.players[g.turn%g.players.length]===me?0:g.status==='over'?2:1;
  const mine=myGames.slice().sort((a,b)=>rank(a)-rank(b)||(b.lastMoveAt||0)-(a.lastMoveAt||0));
  return `<section class="panel"><h2>Start a new game</h2>
  <div class="row"><div class="field" style="flex:1;min-width:200px"><label for="newname">Game name</label><input id="newname" maxlength="60" placeholder="e.g. Dan & Russell"></div>
  <button class="primary" data-act="new" style="align-self:flex-end">Create game</button></div>
  <p class="small muted">You’ll get a link to send your friends on WhatsApp, Messenger or anywhere. They tap it, type their name, and join.</p></section>
  <section class="panel"><h2>My games</h2>${mine.length?`<div class="players">${mine.map(g=>`<div class="pl"><div class="spread"><b>${esc(g.name||'Game')}</b><button class="small ${rank(g)===0?'primary':''}" data-act="open" data-arg="${g.id}">Open</button></div>
  <div class="small muted">${g.players.map(p=>esc(nm(p,g))).join(', ')}</div><div class="small muted">${statusLine(g)}</div></div>`).join('')}</div>`:'<p class="muted">No games yet. Start one above, or open a game link a friend sent you.</p>'}</section>`;
}
function lobby(){
  const inGame=game.players.includes(me);const link=SITE_URL+'#'+gid;
  return `<section class="panel"><h2>Waiting for players</h2>
  <p class="muted">Send this link to your friends. They tap it, type their name, and tap "Join". 2 to ${MAXP} players.</p>
  <div class="row"><input id="roomlink" readonly value="${esc(link)}" style="flex:1;min-width:200px"><button class="small" data-act="copylink">Copy link</button></div>
  <div class="players">${game.players.map(p=>`<div class="pl"><div class="spread"><div class="who"><span>${esc(nm(p))}</span>${p===game.host?'<span class="tag">Host</span>':''}</div>${game.host===me&&p!==me?`<button class="small" data-act="remove" data-arg="${esc(p)}">Remove</button>`:''}</div></div>`).join('')}</div>
  <div class="row">${inGame?'':(game.players.length<MAXP?`<button class="primary big" data-act="join">Join this game</button>`:'<span class="muted">This game is full.</span>')}
  ${game.host===me?`<div class="field" style="max-width:220px"><label for="target">Points per category to win</label><select id="target"><option value="1">1 (short, about 5 turns each)</option><option value="2" selected>2 (medium)</option><option value="3">3 (long, classic)</option></select></div>
  <button class="primary" data-act="start" ${game.players.length<2?'disabled':''}>Start the game</button>`:(inGame?'<span class="muted">The host starts the game when everyone’s in.</span>':'')}</div>
  ${game.host===me&&game.players.length<2?'<p class="small muted">You need at least one more player to start.</p>':''}</section>`;
}
function scoreboard(){
  const sc=scores();const cur=curPlayer();
  const head=game.status==='over'?`<h2>${esc(nm(game.winner))} ${game.winner===me?'win':'wins'}! Everyone give ${game.winner===me?'yourself':'them'} a compliment.</h2>`:`<h2>Race to ${game.target} in every category</h2>`;
  return `<section class="panel">${head}<div class="players">${game.players.map(p=>{const s=sc[p];const up=p===cur&&game.status==='playing';
    return `<div class="pl ${up?'cur':''}"><div class="spread"><div class="who"><span>${esc(nm(p))}</span></div>${up?'<span class="tag">Up now</span>':''}</div>
    <div class="cats">${KEYS.map(k=>`<span class="cat" style="color:${col(k)}" title="${CATS[k].name}: ${s[k]}"><span>${CATS[k].name[0]}</span><span class="pips">${Array.from({length:game.target},(_,i)=>`<span class="pip ${s[k]>i?'on':''}"></span>`).join('')}</span></span>`).join('')}</div>
    <div class="fulfilled">${fulfilledCount(s)} of 5 fulfilled</div></div>`}).join('')}</div></section>`;
}
function cardBox(cat,idx,extra){
  const t=cardText(cat,idx);
  return `<div class="card spin"><div class="stripe" style="background:${col(cat)}"><span>${CATS[cat].name}</span>${extra||''}</div><div class="text">${esc(t)}</div></div>
  ${APART.test(t)?`<div class="note small">Playing apart? Do this on your own and post what you got. Others can join in from the card below.</div>`:''}`;
}
function turnPanel(){
  if(game.status==='over')return `<section class="panel"><h2>Game over</h2><p class="muted">Keep checking off your commitments below. Start a new game any time from "My games".</p></section>`;
  const cur=curPlayer();
  if(!game.players.includes(me))return `<section class="panel"><h2>${esc(nm(cur))} is up</h2><p class="muted">This game already started, so you’re watching. Ask a friend to start a new one with you.</p></section>`;
  if(!myTurn()){
    const days=game.lastMoveAt?Math.max(0,Math.floor((Date.now()-game.lastMoveAt)/86400000)):0;
    return `<section class="panel"><h2>Waiting for ${esc(nm(cur))}</h2>
    <p class="muted">${days?`Their turn started ${days} day${days>1?'s':''} ago.`:'Their turn started today.'} No rush: play when you can. This page updates by itself.</p>
    <div class="row"><button data-act="nudge">Copy a "your turn" message</button></div>
    <p class="small muted">Paste it to ${esc(nameOf(cur))} in WhatsApp, Messenger, LINE or a text.</p></section>`;
  }
  const p=game.pending;const saved=(game.saved||{})[me]||[];
  if(!p){
    return `<section class="panel"><h2>Your turn</h2><p class="muted">Spin to get a category. Answer the card, take your points, and the turn passes on.</p>
    <div class="row"><button class="primary big" data-act="spin">Spin</button></div>
    ${saved.length?`<div class="field"><label>Or play a card you saved</label><div class="row">${saved.map((c,i)=>`<button class="small" data-act="playsaved" data-arg="${i}" style="border-color:${col(c.cat)}">${CATS[c.cat].name} card</button>`).join('')}</div></div>`:''}</section>`;
  }
  if(p.choose){
    const title=`You spun ${CATS[p.from].name}, which you’ve already fulfilled. It’s wild: pick any category.`;
    return `<section class="panel"><h2>${title}</h2><div class="catpick">${KEYS.map(k=>`<button data-act="choose" data-arg="${k}" style="background:${col(k)}">${CATS[k].name}</button>`).join('')}</div></section>`;
  }
  const lim=ptsLimit(p.cat,p.idx);syncPts(p);
  const needC=lim.commit>0&&!ui.commitOpen;
  const hint=lim.commit===0?(lim.share===1?'This card gives 1 point.':`This card gives ${lim.share} points.`)
    :lim.share===0?`This card’s ${lim.commit===1?'point comes':lim.commit+' points come'} from making a commitment.`
    :`${lim.share} for sharing, +${lim.commit} more if you make a commitment.`;
  return `<section class="panel"><h2>Your card</h2>${cardBox(p.cat,p.idx)}
  <div class="row small muted">${heartBtn(p.cat,p.idx)}<span>Tap the heart if this card helped you or you love it. Hearted cards always stay in your deck.</span></div>
  <div class="field"><label for="ans">Your answer (optional: on a call, just say it out loud)</label><textarea id="ans" rows="4" placeholder="Type it, use your phone’s mic key, or leave it blank if you shared out loud."></textarea></div>
  <label class="row" style="color:var(--fg)"><input type="checkbox" id="c_on" style="width:auto" ${ui.commitOpen?'checked':''} data-act="commit"> I’m making a commitment${lim.commit?` (+${lim.commit})`:''}</label>
  <div class="field"><label>Points the card gives you</label><div class="stepper"><button class="small" data-act="pts" data-arg="-1" aria-label="One less point" ${ui.pts<=0?'disabled':''}>−</button><span class="n">${ui.pts}</span><button class="small" data-act="pts" data-arg="1" aria-label="One more point" ${ui.pts>=ptsMax(lim)?'disabled':''}>+</button><span class="small muted">in ${CATS[p.cat].name}</span></div>
  <span class="small muted">${hint}${needC?' Tick the commitment box to unlock the extra.':''}</span></div>
  <div style="display:${ui.commitOpen?'grid':'none'};gap:8px">
    <div class="field"><label for="c_text">What will you do?</label><input id="c_text" placeholder="e.g. Walk 10 minutes every day this week"></div>
    <div class="row"><div class="field" style="flex:1;min-width:160px"><label for="c_partner">Accountability partner</label><select id="c_partner">${others().map(o=>`<option value="${esc(o)}">${esc(nm(o))}</option>`).join('')}</select></div>
    <div class="field" style="flex:1;min-width:160px"><label for="c_due">Check-in date</label><input type="date" id="c_due"></div></div>
  </div>
  <div class="row"><button class="primary" data-act="post">Post and end my turn</button><button data-act="save">Save for later</button><button data-act="pass">Pass</button></div>
  <p class="small muted">No pressure: passing or saving a card is always fine.</p></section>`;
}
/* ---------- game sheet: my commitments, the ones I'm partner for, everyone else's ---------- */
function commitGroups(){
  const list=posts.filter(p=>p.commit);
  return {list,mine:list.filter(p=>p.by===me),partner:list.filter(p=>p.by!==me&&p.commit.partner===me),
    rest:list.filter(p=>p.by!==me&&p.commit.partner!==me)};
}
function fmtDate(d){if(!d)return 'no date';const x=new Date(d+'T12:00:00');return isNaN(x)?d:x.toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'})}
function notesFor(id){return posts.filter(n=>n.kind==='note'&&n.parent===id).sort((a,b)=>a.at-b.at)}
function commitRow(p,mode){
  const c=p.commit;const today=new Date().toISOString().slice(0,10);const late=!c.done&&c.due&&c.due<=today;
  const status=c.done?'<span class="chip" style="background:var(--P)">Done</span>':late?'<span class="chip" style="background:var(--danger)">Check-in time</span>':'';
  const who=mode==='mine'?`Your partner: <b>${esc(c.partner?nameOf(c.partner):'none')}</b>`
    :mode==='partner'?`<b>${esc(nameOf(p.by))}</b> committed. You’re the partner.`
    :`<b>${esc(nameOf(p.by))}</b> · partner ${esc(c.partner?nm(c.partner):'none')}`;
  const ns=notesFor(p.id);const inGame=game.players.includes(me);
  const canTalk=inGame&&(p.by===me||c.partner===me);
  const ask=mode==='partner'&&!c.done?`Hi ${nameOf(p.by)}, how’s it going with: ${c.text}?`:'';
  return `<div class="commit"><div class="spread"><span class="answer">${esc(c.text)}</span>${status}</div>
    <div class="small muted">${who} · by ${esc(fmtDate(c.due))} · ${CATS[p.cat].name}</div>
    ${ns.length?`<div class="replies" style="margin-top:6px">${ns.map(n=>`<div class="reply small"><b>${esc(nm(n.by))}</b> <span class="muted">${new Date(n.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span><div class="answer">${esc(n.text)}</div></div>`).join('')}</div>`:''}
    ${canTalk?`<div class="row" style="margin-top:6px"><input id="n_${p.id}" placeholder="${esc(mode==='partner'?'Send a check-in message':'Send an update or reply')}" style="flex:1;min-width:160px">
      <button class="small" data-act="note" data-arg="${p.id}">Send</button>
      ${ask?`<button class="small" data-act="asknote" data-arg="${p.id}">Ask how it’s going</button>`:''}
      ${!c.done&&p.by===me?`<button class="small primary" data-act="done" data-arg="${p.id}">I did it (+1 ${CATS[p.cat].name})</button>`:''}</div>`:''}
  </div>`;
}
function commitsPanel(){
  const g=commitGroups();const over=game.status==='over';
  if(!g.list.length)return over?`<section class="panel"><h2>Your game sheet</h2><p class="muted">No commitments were made this game.</p></section>`:'';
  return `<section class="panel" id="sheet"><h2>${over?'Your game sheet':'Commitments'}</h2>
  ${over?'<p class="sub">Keep this. Your commitments, who’s holding you to them, and the ones you’re holding others to. This page stays at this link.</p>':''}
  <h3 class="small muted" style="font-family:var(--body);text-transform:uppercase;letter-spacing:.06em">Your commitments</h3>
  ${g.mine.length?g.mine.map(p=>commitRow(p,'mine')).join(''):'<p class="small muted">None yet. Tick “I’m making a commitment” on a card.</p>'}
  <h3 class="small muted" style="font-family:var(--body);text-transform:uppercase;letter-spacing:.06em">You’re the accountability partner for</h3>
  ${g.partner.length?g.partner.map(p=>commitRow(p,'partner')).join(''):'<p class="small muted">Nobody has picked you yet.</p>'}
  ${g.rest.length?`<details><summary class="small">Everyone else’s commitments (${g.rest.length})</summary>${g.rest.map(p=>commitRow(p,'rest')).join('')}</details>`:''}
  <div class="row noprint"><button class="small" data-act="sheetcopy">Copy as text</button><button class="small" data-act="sheetmail">Email it to me</button>
    <button class="small" data-act="sheetprint">Save as PDF / print</button><button class="small" data-act="sheetcal">Add check-in dates to my calendar</button></div>
  </section>`;
}
function sheetText(){
  const g=commitGroups();const L=[];
  L.push(`Better Me game sheet: ${game.name||'our game'} (${nameOf(me)})`,`${SITE_URL}#${gid}`,'');
  L.push('MY COMMITMENTS');
  if(!g.mine.length)L.push('- none');
  g.mine.forEach(p=>L.push(`- ${p.commit.text}\n  By: ${fmtDate(p.commit.due)} · Partner: ${p.commit.partner?nameOf(p.commit.partner):'none'}${p.commit.done?' · DONE':''}`));
  L.push('','I’M THE PARTNER FOR');
  if(!g.partner.length)L.push('- none');
  g.partner.forEach(p=>L.push(`- ${nameOf(p.by)}: ${p.commit.text}\n  By: ${fmtDate(p.commit.due)}${p.commit.done?' · DONE':''}`));
  return L.join('\n');
}
function sheetIcs(){
  const g=commitGroups();const items=g.mine.concat(g.partner).filter(p=>p.commit.due&&!p.commit.done);
  if(!items.length){ui.msg='No check-in dates to add yet.';render();return}
  const e=s=>String(s).replace(/[\\,;]/g,m=>'\\'+m).replace(/\n/g,'\\n');
  const stamp=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=items.map(p=>{const d=p.commit.due.replace(/-/g,'');const nx=new Date(p.commit.due+'T12:00:00');nx.setDate(nx.getDate()+1);
    const d2=nx.toISOString().slice(0,10).replace(/-/g,'');
    const title=p.by===me?`Better Me: ${p.commit.text} (partner ${p.commit.partner?nameOf(p.commit.partner):'none'})`:`Better Me: check in with ${nameOf(p.by)}`;
    return ['BEGIN:VEVENT',`UID:${p.id}@bettermegame.com`,`DTSTAMP:${stamp}`,`DTSTART;VALUE=DATE:${d}`,`DTEND;VALUE=DATE:${d2}`,
      `SUMMARY:${e(title)}`,`DESCRIPTION:${e((p.by===me?'':nameOf(p.by)+' committed to: ')+p.commit.text+'\n'+SITE_URL+'#'+gid)}`,'END:VEVENT'].join('\r\n')}).join('\r\n');
  const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Better Me//Game//EN',ev,'END:VCALENDAR'].join('\r\n');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([ics],{type:'text/calendar'}));a.download='better-me-check-ins.ics';
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);
}
async function addNote(postId,preset){
  const p=posts.find(x=>x.id===postId);if(!p||!p.commit||!(p.by===me||p.commit.partner===me))return;
  const box=$('#n_'+postId);const text=(preset||(box&&box.value)||'').trim();
  if(!text){ui.msg='Type a message first.';return}
  await POSTS().add({by:me,cat:null,idx:null,text:text.slice(0,1000),pts:0,kind:'note',parent:postId,at:Date.now()});
  if(box)box.value='';
}
function joinOpts(p){
  const l=ptsLimit(p.cat,p.idx);const o=[];
  for(let n=l.share;n>=0;n--)o.push(`<option value="${n}" ${n===l.share?'selected':''}>${n}</option>`);
  for(let n=1;n<=l.commit;n++)o.unshift(`<option value="${l.share+n}">${l.share+n} (with a commitment: write it in your answer)</option>`);
  return o.join('');
}
function postLine(p){
  const when=new Date(p.at).toLocaleDateString(undefined,{month:'short',day:'numeric'});
  const chip=p.cat?`<span class="chip" style="background:${col(p.cat)}">${CATS[p.cat].name}</span>`:'';
  if(p.kind==='pass')return `<div class="post"><div class="meta"><b>${esc(nm(p.by))}</b> passed on a card ${chip}<span>${when}</span></div></div>`;
  if(p.kind==='saved')return `<div class="post"><div class="meta"><b>${esc(nm(p.by))}</b> saved a ${CATS[p.cat].name} card to gather courage<span>${when}</span></div></div>`;
  if(p.kind==='kept')return `<div class="post"><div class="meta"><b>${esc(nm(p.by))}</b> kept a commitment ${chip}<span>+1</span><span>${when}</span></div><div class="answer">${esc(p.text)}</div></div>`;
  const t=cardText(p.cat,p.idx);const reps=posts.filter(r=>r.kind==='join'&&r.parent===p.id);
  const canJoin=game.players.includes(me)&&p.by!==me&&!reps.some(r=>r.by===me)&&JOINABLE.test(t)&&game.status==='playing';
  return `<div class="post"><div class="meta"><b>${esc(nm(p.by))}</b>${p.kind==='bonus'?' (bonus card)':''} ${chip}<span>+${p.pts}</span><span>${when}</span>${heartBtn(p.cat,p.idx)}</div>
  <details class="qline"><summary class="small" style="font-family:var(--body);font-weight:500">The card</summary>${esc(t)}</details>
  ${p.text?`<div class="answer">${esc(p.text)}</div>`:''}
  ${p.commit?`<div class="small muted">Committed: ${esc(p.commit.text)}</div>`:''}
  ${reps.length?`<div class="replies">${reps.map(r=>`<div class="reply"><div class="meta"><b>${esc(nm(r.by))}</b> joined in <span>+${r.pts}</span></div><div class="answer">${esc(r.text)}</div></div>`).join('')}</div>`:''}
  ${canJoin?(ui.joinOpen===p.id?`<div class="field"><label for="j_${p.id}">Your answer (optional if you said it out loud)</label><textarea id="j_${p.id}" rows="3"></textarea>
    <div class="row"><label for="jp_${p.id}">Points</label><select id="jp_${p.id}" style="width:auto">${joinOpts(p)}</select><button class="primary small" data-act="joinpost" data-arg="${p.id}">Post</button><button class="small" data-act="joinclose">Cancel</button></div></div>`
    :`<div class="row"><button class="small" data-act="joinopen" data-arg="${p.id}">Join in on this card</button></div>`):''}</div>`;
}
function feed(){
  const top=posts.filter(p=>p.kind!=='join'&&p.kind!=='note').slice().reverse();
  return `<section class="panel"><h2>The story so far</h2>${top.length?`<div class="feed">${top.map(postLine).join('')}</div>`:'<p class="muted">No turns yet. The first answers will show up here.</p>'}</section>`;
}
function suggestBox(){
  const p=game&&game.pending&&game.pending.cat&&myTurn()?game.pending:null;
  const list=sugg.slice().sort((a,b)=>((b.plus||[]).length-(a.plus||[]).length)||(b.at-a.at));
  return `<section class="panel"><details ${ui.suggOpen?'open':''} id="suggdet"><summary>Suggest an improvement</summary>
  <p class="small muted" style="margin:.4em 0">Ideas for the rules, a card, or this app. Everyone can see suggestions and tap "Me too" on ones they agree with.</p>
  <div class="field"><label for="s_topic">About</label><select id="s_topic" style="max-width:240px"><option>Rules</option><option>A card</option><option>The app</option><option>Other</option></select></div>
  ${p?`<label class="row" style="color:var(--fg)"><input type="checkbox" id="s_card" style="width:auto"> It’s about the ${CATS[p.cat].name} card I’m on now</label>`:''}
  <div class="field"><label for="s_text">Your suggestion</label><textarea id="s_text" rows="3" placeholder="e.g. A new card idea, or a rule that slowed us down"></textarea></div>
  <div class="row"><button class="primary small" data-act="suggest">Send suggestion</button></div>
  ${list.length?`<div class="feed" style="margin-top:8px">${list.map(s=>{const n=(s.plus||[]).length;const mine=(s.plus||[]).includes(me);
    return `<div class="post"><div class="meta"><b>${esc(s.by===me?'You':(s.name||'Player'))}</b><span>${esc(s.topic||'')}</span>${s.cat?`<span class="chip" style="background:${col(s.cat)}">${CATS[s.cat].name} card</span>`:''}<span>${new Date(s.at).toLocaleDateString(undefined,{month:'short',day:'numeric'})}</span></div>
    <div class="answer">${esc(s.text)}</div>
    ${s.cat?`<details class="qline"><summary class="small" style="font-family:var(--body);font-weight:500">The card</summary>${esc(cardText(s.cat,s.idx))}</details>`:''}
    <div class="row">${s.by!==me?`<button class="small ${mine?'primary':''}" data-act="plus" data-arg="${s.id}">${mine?'You agreed':'Me too'}</button>`:''}<span class="small muted">${n} agree${n===1?'s':''}</span></div></div>`}).join('')}</div>`:''}
  </details></section>`;
}
function rulesBox(){
  return `<section class="panel"><details ${!game||game.status==='lobby'?'open':''}><summary>How to play</summary>
  <ol><li><b>Spin</b> to get a category: Heart, Mind, Body, People or Tangibles. Already fulfilled it? Then it’s wild: pick any.</li>
  <li><b>Answer the card</b> in writing (or with your phone’s mic key).</li>
  <li><b>Take the points</b> the card says. The turn passes to the next player.</li></ol>
  <ul><li>Fill all 5 categories to the target (1, 2 or 3 points, the host picks) to win. Extra points in a full category don’t count.</li>
  <li>Tap ♡ on any card that helped you. Hearts show which cards people love, and your hearted cards always stay in your deck.</li>
  <li>Cards that say "all players are welcome" can be joined by anyone for the same points.</li>
  <li>Commitments get a partner and a check-in date. Keep one and you earn +1 point.</li>
  <li>No pressure or criticism unless asked. You can always pass or save a card for later.</li>
  <li>Play together on a video call, or take turns whenever you like. Both work.</li></ul></details></section>`;
}
function hostBox(){
  if(game.host!==me||game.status!=='playing')return '';
  return `<section class="panel"><details><summary>Host tools</summary><div class="row" style="margin-top:8px">
  <button class="small" data-act="skip">Skip ${esc(nameOf(curPlayer()))}’s turn</button>
  <button class="small" data-act="endnow">End the game now (most points wins)</button></div>
  <p class="small muted">Use these only when everyone agrees.</p></details></section>`;
}

/* ---------- events ---------- */
document.addEventListener('toggle',e=>{if(e.target&&e.target.id==='suggdet')ui.suggOpen=e.target.open},true);
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target&&e.target.id==='myname'){e.preventDefault();act(saveName)}});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,arg=b.dataset.arg;
  if(a==='commit'){ui.commitOpen=b.checked;const p=game&&game.pending;
    if(p&&p.cat){const lim=ptsLimit(p.cat,p.idx);ui.pts=ui.commitOpen?lim.share+lim.commit:Math.min(ui.pts,lim.share)}
    render();return}
  if(a==='pts'){const p=game&&game.pending;const mx=p&&p.cat?ptsMax(ptsLimit(p.cat,p.idx)):3;ui.pts=Math.max(0,Math.min(mx,ui.pts+ +arg));render();return}
  if(a==='joinopen'){ui.joinOpen=arg;render();return}
  if(a==='joinclose'){ui.joinOpen=null;render();return}
  if(a==='editname'){ui.editName=true;render();return}
  if(a==='sheetcopy'){copyText(sheetText(),'Game sheet copied. Paste it into notes, a message or an email.','');return}
  if(a==='sheetmail'){location.href='mailto:?subject='+encodeURIComponent('My Better Me game sheet')+'&body='+encodeURIComponent(sheetText());return}
  if(a==='sheetprint'){document.body.classList.add('printsheet');window.print();setTimeout(()=>document.body.classList.remove('printsheet'),500);return}
  if(a==='sheetcal'){sheetIcs();return}
  if(a==='home'){openGame(null);return}
  if(a==='open'){openGame(arg);return}
  if(a==='copylink'){copyText(SITE_URL+'#'+gid,'Link copied. Paste it into WhatsApp, Messenger or LINE.','roomlink');return}
  if(a==='nudge'){copyText(`${nameOf(curPlayer())}, it’s your turn in Better Me (${game.name||'our game'})! ${SITE_URL}#${gid}`,'Copied. Paste it into WhatsApp, Messenger, LINE or a text.','');return}
  const map={savename:saveName,new:newGame,join:joinGame,spin,pass:passCard,save:saveCard,post:postAnswer,skip:skipTurn,endnow:endNow,
    suggest:addSuggestion,plus:()=>plusOne(arg),remove:()=>removePlayer(arg),
    start:()=>startGame(+(($('#target')||{}).value||2)),choose:()=>choose(arg),playsaved:()=>playSaved(+arg),
    joinpost:()=>joinIn(arg),done:()=>markDone(arg),note:()=>addNote(arg),asknote:()=>{const p=posts.find(x=>x.id===arg);return addNote(arg,p?`How’s it going with: ${p.commit.text}?`:'')},heart:()=>{const [c,i]=arg.split(':');return toggleHeart(c,+i)}};
  if(map[a])act(map[a]);
});
