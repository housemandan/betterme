<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><title>Play Better Me Online</title>
<meta name="description" content="Play Better Me, the game of growth and friendship, online with friends. Free, no sign-up.">

<style>
/* Layout: a deep-space header band with the infinity logo, then one column of light panels.
   Cards look like the printed ones: a colored category band over black text on white. */
:root{
  --bg:#f5f3fb; --surface:#ffffff; --surface2:#eeeaf8; --fg:#1e1838; --muted:#5f587d; --line:#ddd7ef;
  --teal:#13879a; --lav:#7a66d6; --accentFg:#ffffff; --danger:#c2410c;
  --space1:#140d36; --space2:#2f1f72; --space3:#1b5f7a;
  --cardBg:#ffffff; --cardFg:#1a1a1a;
  --hintBg:#fff6cc; --hintLine:#f0c43a; --hintFg:#6b4e00;
  --H:#e0605a; --M:#9a6bd8; --B:#4f86d9; --P:#45ad4a; --T:#d9a21b; --FF:#7d86a3; --HH:#22a99a;
  --display:"Cinzel",Georgia,serif; --body:"Nunito Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#120d2c; --surface:#1c1640; --surface2:#28205a; --fg:#efecff; --muted:#aba3d6; --line:#352b70;
  --teal:#3cc0d1; --lav:#a596f0; --accentFg:#0e0a24; --danger:#fb923c; color-scheme:dark;
  --hintBg:#3b3212; --hintLine:#e9c14a; --hintFg:#ffe39a}}
:root[data-theme="dark"]{
  --bg:#120d2c; --surface:#1c1640; --surface2:#28205a; --fg:#efecff; --muted:#aba3d6; --line:#352b70;
  --teal:#3cc0d1; --lav:#a596f0; --accentFg:#0e0a24; --danger:#fb923c; color-scheme:dark;
  --hintBg:#3b3212; --hintLine:#e9c14a; --hintFg:#ffe39a}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.55}
.sky{background:
  radial-gradient(1.5px 1.5px at 12% 30%,#fff9,transparent),radial-gradient(1px 1px at 28% 70%,#fff8,transparent),
  radial-gradient(1.5px 1.5px at 47% 22%,#fffa,transparent),radial-gradient(1px 1px at 63% 64%,#fff7,transparent),
  radial-gradient(2px 2px at 81% 35%,#fffb,transparent),radial-gradient(1px 1px at 92% 78%,#fff8,transparent),
  radial-gradient(1px 1px at 6% 85%,#fff7,transparent),radial-gradient(1.5px 1.5px at 37% 48%,#fff6,transparent),
  radial-gradient(60% 120% at 80% 0%,#6b3fb855,transparent),
  linear-gradient(160deg,var(--space1),var(--space2) 55%,var(--space3));
  color:#fff;padding-block:22px 26px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sky .in{max-width:760px;margin:0 auto;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.sky .in{gap:20px 28px}
.brand{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;text-decoration:none;color:#fff}
.brand img{width:190px;height:auto;display:block}
.brand span{font-family:var(--display);font-weight:700;font-size:2rem;letter-spacing:.08em;line-height:1;text-shadow:0 2px 8px #0008}
.sky h1{font-family:var(--display);font-size:1.7rem;margin:0;letter-spacing:.03em;text-wrap:balance}
.sky p{margin:.25em 0 0;color:#fff;font-size:1.05rem}
@media (max-width:520px){.sky .in{justify-content:center;text-align:center}.brand img{width:150px}.brand span{font-size:1.6rem}}
.sky a{color:#fff}
.wrap{max-width:760px;margin:0 auto;padding-block:18px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-family:var(--display);font-size:1.2rem;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);margin:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:999px;padding:9px 18px;border:1px solid var(--line);background:var(--surface2);color:var(--fg)}
button:hover{filter:brightness(1.06)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
button.primary{background:linear-gradient(135deg,var(--teal),var(--lav));color:var(--accentFg);border-color:transparent}
button.big{font-size:1.1rem;padding:13px 26px}
button.small{padding:5px 12px;font-size:.88rem}
button.link{background:none;border:0;padding:0;color:var(--muted);text-decoration:underline;font-weight:600;border-radius:0}
button:disabled{opacity:.45;cursor:default}
input,textarea,select{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;width:100%}
textarea{resize:vertical}
label{font-size:.88rem;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px}
/* Friendly helper look (warm yellow): fields still to fill, and beginner tip bubbles. Never red: nothing is "wrong". */
.field.missing input,.field.missing select,.field.missing textarea{border-color:var(--hintLine);background:var(--hintBg);box-shadow:0 0 0 3px var(--hintLine)}
.field.missing label{color:var(--hintFg);font-weight:700}
.missmsg{color:var(--hintFg);font-size:.9rem;font-weight:700}
.tip{position:relative;background:var(--hintBg);border:2px solid var(--hintLine);color:var(--hintFg);border-radius:14px;padding:10px 14px;margin:2px 0 12px;font-weight:600;animation:tipin .35s ease both}
.tip::after{content:'';position:absolute;left:30px;bottom:-9px;width:14px;height:14px;background:var(--hintBg);border-right:2px solid var(--hintLine);border-bottom:2px solid var(--hintLine);transform:rotate(45deg)}
.tip .tiprow{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.tip button{padding:5px 12px;font-size:.85rem;font-weight:700}
.tip button.tipok{background:var(--hintLine);color:#3a2a00;border-color:var(--hintLine)}
.tip button.tipoff{background:transparent;color:var(--hintFg);border-color:var(--hintLine)}
.tipglow{outline:3px solid var(--hintLine);outline-offset:4px;border-radius:12px;animation:tipglow 2s ease-in-out infinite}
@keyframes tipin{from{opacity:0;transform:translateY(4px)}}
@keyframes tipglow{50%{outline-color:transparent}}
@media (prefers-reduced-motion: reduce){.tip,.tipglow{animation:none}}
.muted{color:var(--muted)}
.small{font-size:.88rem}
.note{background:var(--surface2);border-radius:12px;padding:10px 12px;font-size:.95rem}
.warn{border-left:4px solid var(--teal)}
.players{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.pl{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.pl.cur{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal)}
.who{display:flex;align-items:center;gap:8px;font-weight:800;min-width:0}
.who span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;padding:2px 8px;border-radius:999px;background:linear-gradient(135deg,var(--teal),var(--lav));color:var(--accentFg)}
.winner{display:flex;gap:14px;align-items:center;background:var(--hintBg);border:2px solid var(--hintLine);color:var(--fg);border-radius:16px;padding:14px 18px;margin-bottom:14px}
.winner h2{margin:0 0 4px;font-size:1.6rem}
.winner p{margin:0}
.winner .trophy{font-size:2.6rem;line-height:1}
.cats{display:flex;gap:6px;flex-wrap:wrap}
.cat{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:800;padding:3px 9px;border-radius:999px;
  background:color-mix(in srgb,currentColor 13%,transparent);border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.pips{display:flex;gap:3px}
.pip{width:11px;height:11px;border-radius:50%;border:2px solid currentColor}
.num{font-family:var(--body);font-weight:800}
.pip.on{background:currentColor}
.fulfilled{font-variant-numeric:tabular-nums;font-size:.88rem;color:var(--muted)}
.card{border-radius:14px;overflow:hidden;background:var(--cardBg);color:var(--cardFg);box-shadow:0 2px 10px #1e183822;border:1px solid #0000001a}
.card .stripe{padding:10px 16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;font-size:.95rem;color:#fff;text-shadow:0 1px 2px #0005;display:flex;justify-content:space-between}
.card .text{padding:16px;font-size:1.1rem;line-height:1.6;white-space:pre-line}
.catpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.catpick button{color:#fff;text-shadow:0 1px 2px #0005;border:0;border-radius:12px;padding:16px;letter-spacing:.08em;text-transform:uppercase}
.stepper{display:flex;align-items:center;gap:8px}
.stepper .n{min-width:28px;text-align:center;font-weight:800;font-size:1.15rem;font-variant-numeric:tabular-nums}
.feed{display:flex;flex-direction:column;gap:10px}
.post{border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg)}
.post .meta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:.88rem;color:var(--muted)}
.post .meta b{color:var(--fg)}
.chip{font-size:.74rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#fff;text-shadow:0 1px 1px #0004;border-radius:999px;padding:2px 9px}
.answer{white-space:pre-wrap;overflow-wrap:anywhere}
.qline{font-size:.9rem;color:var(--muted);border-left:3px solid var(--line);padding-left:10px}
.replies{display:flex;flex-direction:column;gap:6px;margin-left:12px}
.reply{border-left:3px solid var(--line);padding-left:10px}
.reacts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
button.react{background:none;border:1px solid var(--line);border-radius:999px;padding:1px 8px;font-size:1rem;min-height:30px;color:var(--muted);font-weight:700;box-shadow:none}
button.react span{font-size:.8rem}
button.react.on{border-color:var(--teal);background:#0000000a;color:var(--fg)}
button.heart{background:none;border-color:var(--line);color:var(--muted);font-weight:700}
button.heart.on{color:#d9334a;border-color:#d9334a66;background:#d9334a12}
.commit{font-size:.92rem;border:1px dashed var(--line);border-radius:10px;padding:8px 10px}
/* Gem = a fulfilled category. Celebration = a short pop-up with falling sparkles. */
.gem{display:inline-block;width:13px;height:13px;margin:0 3px;transform:rotate(45deg);border-radius:3px;
  background:linear-gradient(135deg,#fff 0%,color-mix(in srgb,var(--c) 55%,#fff) 30%,var(--c) 60%,color-mix(in srgb,var(--c) 70%,#000) 100%);
  box-shadow:0 0 6px color-mix(in srgb,var(--c) 60%,transparent)}
.gem.big{width:22px;height:22px;margin:0 6px;flex:none}
.party{position:fixed;inset:0;z-index:50;pointer-events:none;display:flex;align-items:flex-start;justify-content:center;padding-top:90px}
.partybox{pointer-events:auto;background:var(--surface);color:var(--fg);border:2px solid var(--lav);border-radius:18px;padding:16px 20px;
  box-shadow:0 12px 40px #1e183855;display:flex;flex-direction:column;gap:10px;align-items:center;max-width:min(92vw,420px);text-align:center;font-size:1.15rem}
.partyline{display:flex;align-items:center;gap:6px}
.party i{position:absolute;top:-20px;left:var(--x);width:9px;height:9px;transform:rotate(45deg);background:var(--c);opacity:0}
@media (prefers-reduced-motion:no-preference){
  .partybox{animation:partypop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes partypop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
  .party i{animation:sparkle 2.6s ease-in var(--d) forwards}
  @keyframes sparkle{0%{opacity:1;transform:translateY(0) rotate(45deg)}100%{opacity:0;transform:translateY(85vh) rotate(405deg)}}
}
/* Spinner reel: one slot-machine column of category names that slows down and lands. */
.reelwrap{position:fixed;inset:0;z-index:60;display:grid;place-items:center;background:#120d2c88;backdrop-filter:blur(2px)}
.reelbox{width:min(80vw,300px);height:84px;overflow:hidden;border-radius:18px;border:4px solid #fff;box-shadow:0 0 0 4px var(--lav),0 16px 40px #0007;background:#fff}
.reel{transition:transform 1.8s cubic-bezier(.12,.72,.18,1)}
.reelitem{height:84px;display:grid;place-items:center;color:#fff;font:700 1.6rem var(--display);letter-spacing:.06em;text-shadow:0 2px 4px #0006;text-transform:uppercase}
.reelwrap.landed .reelbox{animation:landpop .5s ease-out}
@keyframes landpop{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
.catpick button{position:relative}
.gem.onbtn{width:11px;height:11px;margin-left:8px;vertical-align:1px}
.fullnote{display:block;font-size:.7rem;letter-spacing:.08em;opacity:.9;margin-top:2px}
/* Point chip: a round token in the category color that floats up and fades. */
.chips{position:fixed;left:50%;bottom:22%;transform:translateX(-50%);z-index:49;pointer-events:none;display:flex;gap:14px}
.ptchip{display:flex;flex-direction:column;align-items:center;gap:4px;opacity:0;animation:chipin 2.4s ease-out var(--d) forwards}
.ptchip .coin{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:800 1.5rem var(--body);color:#fff;
  background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--c) 55%,#fff),var(--c) 60%,color-mix(in srgb,var(--c) 75%,#000));
  border:4px solid color-mix(in srgb,var(--c) 70%,#fff);box-shadow:0 6px 18px #0004,inset 0 -3px 0 #0002;text-shadow:0 1px 2px #0006}
.ptchip .who{font-size:.85rem;font-weight:800;color:var(--fg);background:var(--surface);border-radius:999px;padding:2px 10px;box-shadow:0 2px 8px #0002}
@keyframes chipin{0%{opacity:0;transform:translateY(30px) scale(.5)}15%{opacity:1;transform:translateY(0) scale(1.12)}25%{transform:scale(1)}75%{opacity:1;transform:translateY(-30px)}100%{opacity:0;transform:translateY(-70px)}}
@media (prefers-reduced-motion:reduce){.ptchip{animation:none;opacity:1}}
@media print{
  body.printsheet .sky,body.printsheet #main>*:not(#sheet),body.printsheet .noprint,body.printsheet #sheet .row{display:none!important}
  body.printsheet{background:#fff;color:#000}
  body.printsheet #sheet{border:0}
  body.printsheet #sheet details{display:block}
}
details summary{cursor:pointer;font-weight:700;font-family:var(--display)}
details ol,details ul{margin:.4em 0;padding-left:1.3em}
@media (prefers-reduced-motion:no-preference){.spin{animation:pop .35s ease-out}@keyframes pop{from{transform:scale(.96);opacity:.6}to{transform:none;opacity:1}}}
/* Game chat: a small corner button that opens a chat box. */
#chatdock{position:fixed;right:16px;bottom:16px;z-index:50}
.chatbtn{background:linear-gradient(135deg,var(--teal),var(--lav));color:var(--accentFg);border:0;border-radius:999px;padding:10px 16px;font-weight:700;box-shadow:0 4px 14px rgba(30,24,56,.25);cursor:pointer}
.chatnew{background:#2f6fe4;color:#fff;font-weight:700;border-radius:999px;padding:1px 8px;margin-left:4px;font-size:.8rem}
.newchip{display:inline-block;background:#2f6fe4;color:#fff;border-radius:999px;padding:0 7px;font-size:.7rem;font-weight:700;letter-spacing:.04em;vertical-align:middle}
.newdot{color:#2f6fe4;font-weight:700;font-size:.8rem;white-space:nowrap}
.reply.isnew{border-left-color:#2f6fe4}
.newbanner{border-left:4px solid #2f6fe4}
.chatbox{width:min(360px,calc(100vw - 32px));height:min(460px,70vh);display:flex;flex-direction:column;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 10px 30px rgba(30,24,56,.25);overflow:hidden}
.chathead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--line)}
.chathead .muted{flex:1;font-size:.75rem}
.chathead button{font-size:1.1rem;padding:0 4px}
#chatlist{flex:1;overflow-y:auto;padding:10px 12px;display:flex;flex-direction:column;gap:8px}
.chatmsg{max-width:85%;align-self:flex-start}
.chatmsg.mine{align-self:flex-end;text-align:right}
.chatmeta{font-size:.72rem;color:var(--muted);margin-bottom:2px}
.chattext{display:inline-block;text-align:left;background:var(--surface2);border-radius:12px;padding:7px 11px;white-space:pre-wrap;word-break:break-word}
.chatmsg.mine .chattext{background:var(--lav);color:var(--accentFg)}
.chatform{display:flex;gap:6px;padding:8px;border-top:1px solid var(--line)}
.chatform input{flex:1;min-width:0;margin:0}
.sayrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.sayrow .muted{font-size:.8rem}
.voiceplay{margin-left:6px;font-size:.85rem;white-space:nowrap}
.alertrow{margin:6px 0 10px;color:var(--muted)}
.alertrow button{margin-left:6px}
.micbtn{padding:6px 10px;font-size:1.05rem}
.voicebtn{border:0;cursor:pointer;font:inherit;font-weight:700;color:inherit}
.chatmsg.mine .voicebtn{background:var(--lav);color:var(--accentFg)}
.recbar{align-items:center;font-weight:700}
.recdot{width:12px;height:12px;border-radius:50%;background:#e0605a;flex:none}
@media (prefers-reduced-motion:no-preference){.recdot{animation:recpulse 1s ease-in-out infinite}@keyframes recpulse{50%{opacity:.3}}}
@media print{#chatdock{display:none}}
/* Voice player bar (top of screen) and photos. */
#vpbar{position:fixed;left:0;right:0;top:0;z-index:60;display:flex;justify-content:center;padding:8px 12px;pointer-events:none}
.vpin{pointer-events:auto;width:100%;max-width:620px;background:var(--surface);color:var(--fg);border:1px solid var(--line);border-radius:14px;box-shadow:0 6px 20px rgba(30,24,56,.25);padding:8px 12px;display:grid;gap:6px}
.vphead{display:flex;align-items:center;gap:8px;font-size:.9rem}
.vphead b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vpx{font-size:1.1rem;text-decoration:none!important}
.vpctl{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.vpctl button{padding:5px 10px}
#vprange{flex:1;min-width:120px;width:auto;margin:0;padding:0;border:0;background:none;accent-color:var(--lav);height:28px}
.vptime{white-space:nowrap;font-variant-numeric:tabular-nums;color:var(--muted)}
.photorow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.photorow .muted{font-size:.8rem}
.phedit{position:relative;line-height:0}
.phedit img{width:56px;height:56px;object-fit:cover;border-radius:8px;display:block}
.phedit button{position:absolute;top:-7px;right:-7px;width:22px;height:22px;line-height:22px;text-align:center;border-radius:50%!important;background:var(--surface)!important;color:var(--fg)!important;text-decoration:none!important;box-shadow:0 1px 4px #0004;font-size:.75rem}
.phlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
button.phbtn{padding:0;border:0;background:none;border-radius:8px;overflow:hidden;line-height:0;cursor:zoom-in}
.phbtn img{width:84px;height:84px;object-fit:cover;display:block}
button.chatph{border-radius:12px}
.chatph img{width:170px;height:auto;max-height:200px}
#phbox{position:fixed;inset:0;z-index:70;display:flex;align-items:center;justify-content:center;padding:16px}
.phshade{position:absolute;inset:0;background:rgba(20,16,40,.72)}
.phcard{position:relative;background:var(--surface);color:var(--fg);border-radius:14px;padding:10px 12px 12px;max-width:min(94vw,900px);max-height:94vh;display:flex;flex-direction:column;gap:8px;overflow:auto}
.phtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.phtop button{font-size:1.2rem;text-decoration:none}
.phimg img{display:block;max-width:100%;max-height:74vh;border-radius:10px;margin:0 auto}
.phacts{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
a.button{display:inline-block;font-weight:700;border-radius:999px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);text-decoration:none}
