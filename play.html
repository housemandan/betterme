/* ---------- turn alerts (Dan, 2026-11-14) ----------
   Off until a player taps "Turn on" (one per phone/computer). A free Cloudflare Worker (build/push-worker.js) sends them.
   iPhones only allow alerts once Better Me is added to the Home Screen, so they get that tip first. */
const PUSH_URL='https://betterme-alerts.housemandan.workers.dev';
const isIOS=/iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=()=>window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
function alertsSupported(){return !!(PUSH_URL&&'serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window)}
function alertsOn(){return lsGet('bm_alerts')==='on'&&window.Notification&&Notification.permission==='granted'}
async function pushCall(path,extra){const token=await firebase.auth().currentUser.getIdToken();
  const r=await fetch(PUSH_URL+path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.assign({token,gid},extra||{}))});return r.json()}
function pingTurn(){if(!PUSH_URL||!gid||!game||game.practice||isRounds())return;pushCall('/notify').catch(e=>console.warn('alert',e))}
async function alertsEnable(){
  if(isIOS&&!isStandalone()){ui.alertMsg='On iPhone: tap the Share button, then “Add to Home Screen”. Open Better Me from your Home Screen, then turn alerts on there.';return}
  if(!alertsSupported()){ui.alertMsg='This browser can’t show alerts. Try Chrome, or add Better Me to your Home Screen.';return}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){ui.alertMsg='Alerts are blocked for this site. You can allow them in your browser’s site settings any time.';return}
  const reg=await navigator.serviceWorker.ready;
  const {key}=await (await fetch(PUSH_URL+'/key')).json();
  let sub=await reg.pushManager.getSubscription();
  if(!sub){try{sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:urlB64(key)})}
    catch(e){console.warn('subscribe',e);ui.alertMsg=(navigator.brave?'Brave blocks alerts unless you allow its push service. In Brave open Settings, then Privacy and security, and turn on “Use Google services for push messaging”. Then restart Brave and try again. ':'Your browser wouldn’t set up alerts. ')+'Alerts also work on a phone (add Better Me to your Home Screen first on iPhone).';return}}
  const r=await pushCall('/subscribe',{sub:sub.toJSON()});if(!r.ok)throw new Error(r.error||'subscribe');
  lsSet('bm_alerts','on');ui.alertMsg='Turn alerts are on for this device. 🔔';
  pushCall('/test').catch(()=>{});
}
async function alertsDisable(){
  lsSet('bm_alerts','off');ui.alertMsg='Turn alerts are off.';
  try{await pushCall('/unsubscribe');const reg=await navigator.serviceWorker.ready;const s=await reg.pushManager.getSubscription();if(s)await s.unsubscribe()}catch(e){console.warn(e)}
}
function urlB64(s){s=s.replace(/-/g,'+').replace(/_/g,'/');while(s.length%4)s+='=';const b=atob(s);return Uint8Array.from(b,c=>c.charCodeAt(0))}
function alertsRow(){
  if(!PUSH_URL||!game||game.practice||game.together||!game.players.includes(me)||game.status==='over'||game.players.filter(p=>!isBot(p)).length<2)return '';
  const on=alertsOn();const m=ui.alertMsg?`<div class="small" style="margin-top:4px">${esc(ui.alertMsg)}</div>`:'';
  return `<div class="alertrow small">${on?`🔔 Turn alerts are on <button class="link" data-act="alertsoff">Turn off</button>`
    :`🔔 ${game.mode==='rounds'?'Want a heads-up when friends play and when a new round starts?':'Want a heads-up when it’s your turn?'} <button class="small" data-act="alertson">Turn on alerts</button>`}${m}</div>`;
}

/* ---------- voice answers (Dan's friend's idea, 2026-11-14) ----------
   Any answer or commitment box gets a "🎤 Say it" button. The recording is saved (games/{id}/audio, same as chat
   voice messages) and typed out by the free Whisper model on our Cloudflare Worker, straight into the box,
   where the player can fix any wrong words. The post keeps both: the text (for reading and the game sheet) and a ▶ play button. */
const VOICE_SEL='#ans,#c_text,#jc_text,textarea[id^="j_"],input[id^="n_"]';const MAX_CLIPS=5; /* up to 5 one-minute clips per box */
ui.voice={};let vRec=null;
function voiceOK(){return !!(PUSH_URL&&canRecord()&&game&&gid&&game.players&&game.players.includes(me))}
function applyVoice(){
  if(!voiceOK())return;
  document.querySelectorAll(VOICE_SEL).forEach(el=>{
    const id=el.id,box=el.closest('.field')||el.parentNode;if(!box||box.querySelector('.sayrow'))return;
    const v=ui.voice[id]||{};const rec=vRec&&vRec.field===id;
    const row=document.createElement('div');row.className='sayrow small';
    row.innerHTML=rec?`<span class="recdot" aria-hidden="true"></span><b class="saytime">Recording ${fmtDur(recSecsV())} / 1:00</b><button type="button" class="small primary" data-say="stop" data-arg="${id}">Done</button><button type="button" class="small" data-say="cancel" data-arg="${id}">Cancel</button>`
      :v.busy?`<span>✍️ Typing out what you said…</span>`
      :(v.clips&&v.clips.length)?`${v.clips.map((c,i)=>clipBtn(c,v.clips.length>1?'Clip '+(i+1):'Your clip','You','link')).join('')}${v.clips.length<MAX_CLIPS?`<button type="button" class="small sayit" data-say="rec" data-arg="${id}">🎤 Add more</button>`:''}<button type="button" class="link" data-say="remove" data-arg="${id}">Remove voice</button>${v.note?`<span class="muted">${esc(v.note)}</span>`:''}`
      :`<button type="button" class="small sayit" data-say="rec" data-arg="${id}">🎤 Say it</button><span class="muted">or type it</span>`;
    box.appendChild(row);
  });
}
function recSecsV(){return vRec?(Date.now()-vRec.start)/1000:0}
function refreshVoice(){document.querySelectorAll('.sayrow').forEach(r=>r.remove());applyVoice()}
async function sayRec(field){
  if(vRec||recorder)return;
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}
  catch(e){ui.voice[field]={note:'Microphone blocked. You can still type.'};refreshVoice();return}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  let mr;try{mr=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:24000},type?{mimeType:type}:{}))}catch(e){mr=new MediaRecorder(stream)}
  const chunks=[];vRec={field,mr,start:Date.now(),cancel:false};
  mr.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
  mr.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(vRec.timer);
    const dur=Math.min(REC_MAX,recSecsV()),cancel=vRec.cancel,mime=mr.mimeType||type||'audio/webm';vRec=null;
    if(cancel||dur<0.7||!chunks.length||!$('#'+field)){refreshVoice();return}
    /* (clips so far are kept; each new one is added on) */
    const prev=(ui.voice[field]&&ui.voice[field].clips)||[];ui.voice[field]={busy:true,clips:prev};refreshVoice();
    try{
      const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(new Blob(chunks,{type:mime}))});
      if(data.length>900000)throw new Error('too big');
      const ref=await fs.collection('games').doc(gid).collection('audio').add({by:me,data,mime,dur,at:Date.now()});
      audioCache.set(ref.id,data);
      let text='',note='';
      try{text=((await pushCall('/transcribe',{audio:data}))||{}).text||''}catch(e){console.warn(e)}
      if(!text)note='Couldn’t type it out, but your voice is saved. Add a few words if you like.';
      const el=$('#'+field);
      if(el&&text){el.value=(el.value.trim()?el.value.trim()+' ':'')+text;el.dispatchEvent(new Event('input',{bubbles:true}))}
      ui.voice[field]={clips:prev.concat({id:ref.id,dur}),note};
    }catch(e){console.error(e);ui.voice[field]={clips:prev,note:'That recording didn’t save. Try again, or type it.'}}
    refreshVoice();
  };
  mr.start(1000);
  vRec.timer=setInterval(()=>{const t=document.querySelector('.saytime');if(t)t.textContent='Recording '+fmtDur(recSecsV())+' / 1:00';if(recSecsV()>=REC_MAX)sayStop(false)},250);
  refreshVoice();
}
function sayStop(cancel){if(!vRec)return;vRec.cancel=!!cancel;try{vRec.mr.stop()}catch(e){}}
/* ---------- voice player (Dan, 2026-11-14) ----------
   One bar pinned to the top of the screen (outside #main, so the page re-drawing never stops it).
   A slider to jump anywhere, 10-second back and forward, and it remembers where each clip was stopped:
   close it by accident, tap ▶ again, and it picks up from there. */
let vp=null;
function vpSaved(){try{return JSON.parse(lsGet('bm_vpos')||'{}')||{}}catch(e){return {}}}
function vpRemember(id,t){const s=vpSaved();if(t>1)s[id]=Math.round(t);else delete s[id];const k=Object.keys(s);if(k.length>80)delete s[k[0]];lsSet('bm_vpos',JSON.stringify(s))}
function vpAt(id){return vpSaved()[id]||0}
async function audioData(id){let data=audioCache.get(id);if(!data){const d=await fs.collection('games').doc(gid).collection('audio').doc(id).get();data=d.exists?d.data().data:null;if(data)audioCache.set(id,data)}return data}
function vpDur(){if(!vp)return 0;const d=vp.a.duration;return isFinite(d)&&d>0?d:vp.dur||0}
async function vpOpen(id,dur,label){
  if(vp&&vp.id===id){if(vp.err||vp.loading)return;if(vp.a.paused)vp.a.play().catch(()=>{});else vp.a.pause();return}
  vpClose();
  const a=new Audio();vp={id,a,dur:Number(dur)||0,label:label||'Voice clip',loading:true,drag:false,lastSave:0};vpRender();
  try{
    const data=await audioData(id);if(!vp||vp.id!==id)return;if(!data)throw new Error('missing');
    a.preload='auto';
    await new Promise((ok,no)=>{a.onloadedmetadata=ok;a.onerror=()=>no(new Error('cannot play'));a.src=data});
    /* Recordings made in Chrome don't say how long they are; this makes the browser work it out so the slider can jump. */
    if(!isFinite(a.duration)){await new Promise(ok=>{let t;const done=()=>{if(!isFinite(a.duration))return;a.removeEventListener('durationchange',done);clearTimeout(t);ok()};a.addEventListener('durationchange',done);t=setTimeout(()=>{a.removeEventListener('durationchange',done);ok()},2000);a.currentTime=1e7})}
    if(!vp||vp.id!==id)return;
    const start=vpAt(id);a.currentTime=start&&start<vpDur()-1?start:0;
    vp.loading=false;
    a.ontimeupdate=vpTick;a.onplay=a.onpause=()=>{vpRender();syncVoiceBtns()};
    a.onended=()=>{vpRemember(id,0);if(vp&&vp.id===id){vp.ended=true;vpRender();syncVoiceBtns()}};
    vpRender();await a.play();
  }catch(e){console.error(e);if(vp&&vp.id===id){vp.loading=false;vp.err=true;vpRender()}}
}
function vpClose(){
  if(!vp)return;
  if(!vp.loading&&!vp.err&&!vp.ended)vpRemember(vp.id,vp.a.currentTime);
  try{vp.a.pause()}catch(e){}vp=null;vpRender();syncVoiceBtns();
}
function vpRender(){
  let bar=$('#vpbar');
  if(!vp){if(bar)bar.remove();return}
  if(!bar){bar=document.createElement('div');bar.id='vpbar';bar.setAttribute('role','region');bar.setAttribute('aria-label','Voice player');document.body.appendChild(bar)}
  const d=vpDur(),t=vp.loading||vp.err?0:vp.a.currentTime,playing=!vp.a.paused;
  bar.innerHTML=`<div class="vpin"><div class="vphead"><b>🎤 ${esc(vp.label)}</b><button type="button" class="link vpx" data-vp="close" aria-label="Close player">✕</button></div>
    ${vp.err?'<div class="small">That clip couldn’t play here. Try another browser.</div>':vp.loading?'<div class="small muted">Loading…</div>':
    `<div class="vpctl"><button type="button" class="small" data-vp="back" aria-label="Back 10 seconds">↺ 10</button><button type="button" class="small primary" data-vp="toggle" aria-label="${playing?'Pause':'Play'}">${playing?'⏸':'▶'}</button><button type="button" class="small" data-vp="fwd" aria-label="Forward 10 seconds">10 ↻</button>
    <input type="range" id="vprange" min="0" max="${d.toFixed(1)}" step="0.1" value="${Math.min(t,d).toFixed(1)}" aria-label="Drag to jump to any spot"><span class="vptime small">${fmtDur(t)} / ${fmtDur(d)}</span></div>`}</div>`;
}
function vpTick(){
  if(!vp||vp.drag)return;const t=vp.a.currentTime,d=vpDur();
  const r=$('#vprange'),s=document.querySelector('#vpbar .vptime');
  if(r){r.max=d.toFixed(1);r.value=Math.min(t,d).toFixed(1)}if(s)s.textContent=fmtDur(t)+' / '+fmtDur(d);
  if(Math.abs(t-vp.lastSave)>3){vp.lastSave=t;vpRemember(vp.id,t)}
}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-vp]');if(!b||!vp)return;e.preventDefault();const a=vp.a,k=b.dataset.vp;
  if(k==='close'){vpClose();return}
  if(vp.loading||vp.err)return;
  if(k==='toggle'){vp.ended=false;if(a.paused)a.play().catch(()=>{});else a.pause()}
  if(k==='back')a.currentTime=Math.max(0,a.currentTime-10);
  if(k==='fwd')a.currentTime=Math.min(Math.max(0,vpDur()-0.2),a.currentTime+10);
  vpTick();});
document.addEventListener('input',e=>{if(e.target&&e.target.id==='vprange'&&vp&&!vp.loading){vp.drag=true;vp.ended=false;vp.a.currentTime=Number(e.target.value);const s=document.querySelector('#vpbar .vptime');if(s)s.textContent=fmtDur(e.target.value)+' / '+fmtDur(vpDur())}});
document.addEventListener('change',e=>{if(e.target&&e.target.id==='vprange'&&vp){vp.drag=false;vpRemember(vp.id,vp.a.currentTime)}});
/* A ▶ button for one saved clip. Shows where you stopped last time, e.g. "▶ Listen (0:42 of 1:00)". */
function clipText(id,dur,label){const at=vpAt(id),on=vp&&vp.id===id&&!vp.a.paused;dur=Number(dur)||0;
  return `${on?'⏸':'▶'} ${label} (${at>1&&at<dur-1?fmtDur(at)+' of ':''}${fmtDur(dur)})`}
function clipBtn(c,label,who,cls){return `<button type="button" class="${cls||'link voiceplay'}" data-say="play" data-arg="${esc(c.id)}" data-dur="${Math.round(c.dur||0)}" data-who="${esc(who||'')}" data-label="${esc(label)}">${esc(clipText(c.id,c.dur,label))}</button>`}
function syncVoiceBtns(){document.querySelectorAll('[data-say="play"][data-label]').forEach(b=>{b.textContent=clipText(b.dataset.arg,b.dataset.dur,b.dataset.label)})}
/* Saved posts keep a list of clips (older posts may hold a single {id,dur}). */
function voiceTag(v,who){const a=Array.isArray(v)?v:(v&&v.id?[v]:[]);return a.map((c,i)=>' '+clipBtn(c,'Listen'+(a.length>1?' '+(i+1):''),who)).join('')}
function takeVoice(field){const v=ui.voice[field];return v&&v.clips&&v.clips.length?v.clips.map(c=>({id:c.id,dur:Math.round(c.dur||0)})):null}
function clearVoice(...fields){if(vRec&&fields.includes(vRec.field))sayStop(true);fields.forEach(f=>{delete ui.voice[f];delete ui.photos[f]})}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-say]');if(!b)return;e.preventDefault();
  const a=b.dataset.say,arg=b.dataset.arg;
  if(a==='rec')sayRec(arg);
  if(a==='stop')sayStop(false);
  if(a==='cancel')sayStop(true);
  if(a==='remove'){delete ui.voice[arg];refreshVoice()}
  if(a==='play')vpOpen(arg,b.dataset.dur,b.dataset.who||'Voice clip');
});

/* ---------- photos (Dan, 2026-11-14) ----------
   📷 next to answer, commitment and check-in boxes, and in the chat. Each photo is shrunk in the browser
   (about 1280px, ~200 KB), which also strips hidden location data, then saved in games/{id}/photos.
   The post keeps a tiny preview (~10 KB) so the feed stays fast; the full photo downloads only when someone
   taps it, or for the game sheet once the game is over (and when printing). Each photo has expireAt
   (1 year), so a Firestore clean-up rule can be switched on later if storage ever runs short. */
const PHOTO_MAX=3;ui.photos={};const photoCache=new Map();let photoFor=null;
function photoOK(){return !!(game&&gid&&game.players&&game.players.includes(me))}
function okThumb(t){return typeof t==='string'&&t.length<80000&&/^data:image\/(jpeg|png|webp);base64,[A-Za-z0-9+/=]+$/.test(t)}
function loadImg(file){return new Promise((ok,no)=>{const u=URL.createObjectURL(file),i=new Image();i.onload=()=>ok(i);i.onerror=()=>{URL.revokeObjectURL(u);no(new Error('not an image'))};i.src=u})}
function shrink(img,max,q){const w0=img.naturalWidth,h0=img.naturalHeight,k=Math.min(1,max/Math.max(w0,h0));const c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w0*k));c.height=Math.max(1,Math.round(h0*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(img,0,0,c.width,c.height);
  return {data:c.toDataURL('image/jpeg',q),w:c.width,h:c.height}}
async function savePhoto(file){
  const img=await loadImg(file);
  let f=shrink(img,1280,0.8);if(f.data.length>420000)f=shrink(img,1024,0.7);if(f.data.length>420000)f=shrink(img,800,0.6);
  const t=shrink(img,240,0.6).data;URL.revokeObjectURL(img.src);
  const at=Date.now();
  const ref=await fs.collection('games').doc(gid).collection('photos').add({by:me,data:f.data,w:f.w,h:f.h,at,expireAt:new Date(at+365*864e5)});
  photoCache.set(ref.id,{data:f.data,by:me});
  return {id:ref.id,t};
}
async function photoData(id){
  if(photoCache.has(id))return photoCache.get(id);
  const s=await fs.collection('games').doc(gid).collection('photos').doc(id).get();const v=s.exists?s.data():null;
  const r={data:v&&typeof v.data==='string'&&/^data:image\//.test(v.data)?v.data:'',by:v&&v.by};photoCache.set(id,r);return r;
}
function pickPhoto(field){
  let inp=$('#photoin');
  if(!inp){inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.id='photoin';inp.hidden=true;inp.addEventListener('change',onPhotoPicked);document.body.appendChild(inp)}
  photoFor=field;inp.value='';inp.click();
}
async function onPhotoPicked(e){
  const file=e.target.files&&e.target.files[0];const field=photoFor;photoFor=null;if(!file||!field)return;
  if(field==='chat')return chatPhoto(file);
  const list=((ui.photos[field]||{}).list||[]).slice();if(list.length>=PHOTO_MAX)return;
  ui.photos[field]={list,busy:true};refreshPhotos();
  try{const ph=await savePhoto(file);if(ui.photos[field])ui.photos[field]={list:list.concat(ph)}}
  catch(err){console.error(err);ui.photos[field]={list,note:'That photo didn’t work. Try another one.'}}
  refreshPhotos();
}
async function chatPhoto(file){
  if(!chatOK())return;
  try{const ph=await savePhoto(file);await fs.collection('games').doc(gid).collection('chat').add({by:me,name:myName,text:'📷 Photo',photo:ph.id,t:ph.t,at:Date.now()});bumpAct('chat')}
  catch(e){console.error(e);alertChat('That photo didn’t send. Try another one, or check your connection.')}
}
function applyPhotos(){
  if(!photoOK())return;
  document.querySelectorAll(VOICE_SEL).forEach(el=>{
    const id=el.id,box=el.closest('.field')||el.parentNode;if(!box||box.querySelector('.photorow'))return;
    const v=ui.photos[id]||{list:[]};
    const row=document.createElement('div');row.className='photorow small';
    row.innerHTML=`${v.list.map((p,i)=>`<span class="phedit"><img src="${esc(p.t)}" alt="Photo ${i+1}"><button type="button" class="link" data-ph="drop" data-arg="${id}" data-i="${i}" aria-label="Remove photo ${i+1}">✕</button></span>`).join('')}${v.busy?'<span>Adding photo…</span>':v.list.length<PHOTO_MAX?`<button type="button" class="small" data-ph="pick" data-arg="${id}">📷 ${v.list.length?'Add another':'Add a photo'}</button>`:''}${v.note?`<span class="muted">${esc(v.note)}</span>`:''}`;
    box.appendChild(row);
  });
}
function refreshPhotos(){document.querySelectorAll('.photorow').forEach(r=>r.remove());applyPhotos()}
function takePhotos(field){const v=ui.photos[field];return v&&v.list&&v.list.length?v.list.map(p=>({id:p.id,t:p.t})):null}
function photoTag(list,who){const a=(Array.isArray(list)?list:[]).filter(p=>p&&p.id&&okThumb(p.t));if(!a.length)return '';
  return `<div class="phlist">${a.map((p,i)=>`<button type="button" class="phbtn" data-ph="view" data-arg="${esc(p.id)}" data-who="${esc(who||'')}" aria-label="Open photo ${i+1}"><img src="${esc(p.t)}" alt=""></button>`).join('')}</div>`}
async function phView(id,who){
  let box=$('#phbox');if(!box){box=document.createElement('div');box.id='phbox';document.body.appendChild(box)}
  box.innerHTML=`<div class="phshade" data-ph="close"></div><div class="phcard" role="dialog" aria-label="Photo"><div class="phtop"><b>${esc(who||'Photo')}</b><button type="button" class="link" data-ph="close" aria-label="Close photo">✕</button></div><div class="phimg"><p class="muted">Loading…</p></div></div>`;
  let d=null;try{d=await photoData(id)}catch(e){console.error(e)}
  const at=box.querySelector('.phimg');if(!at||!$('#phbox'))return;
  if(!d||!d.data){at.innerHTML='<p class="muted">This photo isn’t here any more.</p>';return}
  at.innerHTML=`<img src="${esc(d.data)}" alt="Photo${who?' from '+esc(who):''}"><div class="phacts"><a class="button small" href="${esc(d.data)}" download="better-me-photo.jpg">Save photo</a>${d.by===me?`<button type="button" class="small" data-ph="del" data-arg="${esc(id)}">Delete photo</button>`:''}</div>`;
}
function phClose(){const x=$('#phbox');if(x)x.remove()}
/* Delete my own photo everywhere: the full photo, and the little previews in my posts and chat messages. */
async function removePhoto(id){
  await fs.collection('games').doc(gid).collection('photos').doc(id).update({data:'',gone:true});
  photoCache.set(id,{data:'',by:me});
  const has=l=>Array.isArray(l)&&l.some(x=>x&&x.id===id),drop=l=>l.filter(x=>x&&x.id!==id);
  for(const p of posts){if(p.by!==me)continue;const patch={};
    if(has(p.photos))patch.photos=drop(p.photos);if(p.commit&&has(p.commit.photos))patch['commit.photos']=drop(p.commit.photos);
    if(Object.keys(patch).length)await POSTS().doc(p.id).update(patch)}
  for(const m of chat){if(m.by===me&&m.photo===id)await fs.collection('games').doc(gid).collection('chat').doc(m.id).update({photo:null,t:null,text:'📷 Photo deleted'})}
}
/* Game sheet: every photo from the game, full size once the game is over, so "Save as PDF" keeps them. */
function allPhotos(){const out=[];const add=(l,by)=>(Array.isArray(l)?l:[]).forEach(p=>{if(p&&p.id&&okThumb(p.t))out.push({id:p.id,t:p.t,by})});
  posts.forEach(p=>{add(p.photos,p.by);if(p.commit)add(p.commit.photos,p.by)});
  chat.forEach(m=>{if(m.photo&&okThumb(m.t))out.push({id:m.photo,t:m.t,by:m.by})});
  return out}
function sheetPhotos(){const a=allPhotos();if(!a.length)return '';
  return `<h3 class="small muted" style="font-family:var(--body);text-transform:uppercase;letter-spacing:.06em">Photos from this game (${a.length})</h3>
  <p class="small muted">Photos are kept for 1 year after they’re posted. Tap “Save as PDF / print” to keep them for good.</p>
  <div class="phgrid">${a.map(p=>{const c=photoCache.get(p.id);if(c&&c.data==='')return '';const src=c&&c.data?c.data:p.t;
    return `<figure><button type="button" class="phbtn phwide" data-ph="view" data-arg="${esc(p.id)}" data-who="${esc(nm(p.by))}" aria-label="Open photo from ${esc(nm(p.by))}"><img data-full="${esc(p.id)}" src="${esc(src)}" alt="Photo from ${esc(nm(p.by))}"></button><figcaption>${esc(nm(p.by))}</figcaption></figure>`}).join('')}</div>`}
async function loadFulls(){await Promise.all([...document.querySelectorAll('img[data-full]')].map(async i=>{try{const d=await photoData(i.dataset.full);if(d&&d.data&&i.getAttribute('src')!==d.data)i.src=d.data}catch(e){}}))}
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('[data-ph]');if(!b)return;e.preventDefault();const k=b.dataset.ph,arg=b.dataset.arg;
  if(k==='pick')pickPhoto(arg);
  if(k==='drop'){const v=ui.photos[arg];if(v&&v.list){const gone=v.list.splice(Number(b.dataset.i),1)[0];
    if(gone)fs.collection('games').doc(gid).collection('photos').doc(gone.id).update({data:'',gone:true}).catch(()=>{})}refreshPhotos()}
  if(k==='view')phView(arg,b.dataset.who);
  if(k==='close')phClose();
  if(k==='del'){if(!b.dataset.sure){b.dataset.sure='1';b.textContent='Tap again to delete';return}
    b.disabled=true;removePhoto(arg).then(()=>{phClose();render()}).catch(err=>{console.error(err);b.textContent='Couldn’t delete. Try again.';b.disabled=false;delete b.dataset.sure})}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#phbox'))phClose()});

/* ---------- game chat (Dan, 2026-11-14) ----------
   One group chat per game, players only. It lives in its own corner box (#chatdock), outside #main,
   so the main page re-drawing never wipes what someone is typing. Closed by default: a small button with a "new" count. */
let chat=[],unChat=null;ui.chatOpen=false;
function chatOK(){return !!(gid&&game&&game.players&&game.players.includes(me)&&game.players.filter(p=>!isBot(p)).length>=2)}
function stopChat(){if(unChat)unChat();unChat=null;chat=[];ui.chatOpen=false;renderChat()}
function syncChat(){
  if(!chatOK()){if(unChat)stopChat();else renderChat();return}
  if(!unChat)unChat=fs.collection('games').doc(gid).collection('chat').orderBy('at','asc').limitToLast(200)
    .onSnapshot(s=>{chat=s.docs.map(d=>Object.assign({id:d.id},d.data()));if(ui.chatOpen)chatMarkRead();renderChat()},
      /* Right after joining, the server may not know you're a player yet: wait a moment and try again. */
      e=>{console.warn('chat retry',e&&e.code);unChat=null;const g=gid;setTimeout(()=>{if(gid===g)syncChat()},3000)});
  renderChat();
}

  catch(e){alertChat('The microphone is blocked, so voice messages can’t record. You can still type. (Allow the microphone in your browser settings to use 🎤.)');return}
  const type=['audio/webm;codecs=opus','audio/mp4','audio/ogg;codecs=opus','audio/webm'].find(t=>MediaRecorder.isTypeSupported&&MediaRecorder.isTypeSupported(t));
  try{recorder=new MediaRecorder(stream,Object.assign({audioBitsPerSecond:24000},type?{mimeType:type}:{}))}catch(e){recorder=new MediaRecorder(stream)}
  recChunks=[];recCancel=false;
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data)};
  recorder.onstop=async()=>{
    stream.getTracks().forEach(t=>t.stop());clearInterval(recTimer);
    const dur=Math.min(REC_MAX,recSecs()),mime=recorder.mimeType||type||'audio/webm';recorder=null;recStart=0;ui.rec=false;renderChat();
    if(recCancel||dur<0.7||!recChunks.length)return;
    const blob=new Blob(recChunks,{type:mime});
    const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(blob)});
    if(data.length>900000){alertChat('That recording was too big to send. Try a shorter one.');return}

      const ref=await fs.collection('games').doc(gid).collection('audio').add({by:me,data,mime,dur,at:Date.now()});
      audioCache.set(ref.id,data);
      await fs.collection('games').doc(gid).collection('chat').add({by:me,name:myName,text:'🎤 Voice message ('+fmtDur(dur)+')',audio:ref.id,dur,at:Date.now()});bumpAct('chat');
    }catch(e){console.error(e);alertChat('That voice message didn’t send. Check your connection and try again.')}
  };

  recTimer=setInterval(()=>{const t=$('#rectime');if(t)t.textContent='Recording '+fmtDur(recSecs())+' / 1:00';if(recSecs()>=REC_MAX)stopRec(false)},250);

/* ---------- rounds engine ----------
   roundsFinish: in one safe step (a transaction, so two players finishing together can't confuse it) mark a player done.
   When only one player is left, remember when (lastCall) so the 12-hour clock can start.
   roundsCheck/roundsAdvance: once everyone is done (or the clock ran out), ONE browser starts the next round, or ends the game
   if somebody has all 5 categories filled. The game only ends at the end of a round, so everyone has had the same number of cards. */
async function roundsFinish(extra,who){
  who=who||me;
  const out=await fs.runTransaction(async tx=>{
    const s=await tx.get(G());if(!s.exists)return null;const g=s.data();
    if(g.status!=='playing')return null;
    const rd=g.round||1,done=g.roundDone||{};
    if(done[who]===rd)return null;
    const patch=Object.assign({},extra||{},{['pendings.'+who]:null,['roundDone.'+who]:rd,lastMoveAt:Date.now()});
    const left=g.players.filter(p=>p!==who&&done[p]!==rd&&!isBot(p));
    if(g.together)patch.handoff=true;
    else if(left.length===1&&!(g.lastCall&&g.lastCall.round===rd))patch.lastCall={round:rd,at:Date.now(),who:left[0]};
    tx.update(G(),patch);return {rd,left:left.length};
  });
  if(out&&who===me)pingRound('card');
}

  const expired=!!(lc&&!game.together&&lc.round===rd&&Date.now()>=lc.at+ROUND_WAIT_MS&&lc.who!==me);
  if(left.length&&!expired)return;

async function roundsAdvance(){
  if(advBusy||!isRounds()||game.status!=='playing')return;
  advBusy=true;
  try{
    const rd=roundNo();
    const fresh=(await POSTS().get()).docs.map(d=>Object.assign({id:d.id},d.data()));
    const r=checkEnd(fresh);
    const res=await fs.runTransaction(async tx=>{
      const s=await tx.get(G());if(!s.exists)return null;const g=s.data();
      if(g.status!=='playing'||(g.round||1)!==rd)return null;
      const done=g.roundDone||{},left=g.players.filter(p=>done[p]!==rd),lc=g.lastCall;
      const expired=!!(lc&&!g.together&&lc.round===rd&&Date.now()>=lc.at+ROUND_WAIT_MS&&lc.who!==me);
      if(left.length&&!expired)return null;
      const winners=g.players.filter(p=>r.winners.includes(p));
      const patch={lastMoveAt:Date.now(),lastCall:null};
      if(winners.length)Object.assign(patch,{status:'over',winner:winners[0],winners,handoff:false});
      else Object.assign(patch,{round:rd+1,roundStartedAt:Date.now()});
      tx.update(G(),patch);return {over:winners.length>0};
    });
    if(res&&!res.over)pingRound('round');
  }finally{advBusy=false}
}

function statusLine(g){

  ${watching.length?`<h3 style="margin:14px 0 4px">Games you opened by link</h3><p class="small muted">You’re not a player in these on this device. Opened them on another phone or browser? Open the game, then tap “I’m …” to continue as yourself here.</p>${gameCards(watching,rank,'hide','Hide')}`:''}
  ${old.length?`<details style="margin-top:10px"><summary>Finished and practice games (${old.length})</summary>${gameCards(old,rank,'hide','Hide')}</details>`:''}
  ${hid.length?`<details style="margin-top:10px"><summary>Hidden games (${hid.length})</summary>${gameCards(hid,rank,'unhide','Bring back')}<p class="small muted">Hiding only tidies this list on this device. Nothing is deleted, and everyone else still sees the game.</p></details>`:''}</section>`;

/* Play again (Dan, 2026-11-15): one player makes a new game; everyone else sees a "Join the new game" button here. */
async function playAgain(){
  if(!game||game.status!=='over'||game.rematch||!game.players.includes(me))return;
  if(game.together){openGame(await createTogether(game.players.map(p=>nameOf(p)),game.target||2));return}
  const id=newId();
  await fs.collection('games').doc(id).set({name:defaultGameName(),mode:'rounds',status:'lobby',players:[me],names:{[me]:myName},host:me,target:game.target||2,turn:0,pending:null,saved:{},firsts:{},winner:null,createdAt:Date.now(),lastMoveAt:Date.now(),from:gid});
  await G().update({rematch:id,rematchBy:me});
  openGame(id);
}
function autoJoinNext(){
  if(!ui.autoJoin||!game||game.id!==ui.autoJoin||game.status!=='lobby'||game.players.includes(me)||!myName)return;
  ui.autoJoin=null;joinGame().catch(e=>console.warn('autojoin',e));
}
function rematchBox(){
  if(!game.players.includes(me)||game.practice)return '';
  if(game.rematch){const by=game.rematchBy===me;
    return `<div class="note" style="margin-top:10px">🎲 ${by?'You started':esc(nameOf(game.rematchBy))+' started'} a new game with the same people.
      <div class="row" style="margin-top:6px"><button class="primary" data-act="${by?'open':'joinnext'}" data-arg="${esc(game.rematch)}">${by?'Open the new game':'Join the new game'}</button></div></div>`}
  if(game.together)return `<div class="row" style="margin-top:10px"><button class="primary" data-act="playagain">Play again with the same players</button></div>`;
  return `<div class="row" style="margin-top:10px"><button class="primary" data-act="playagain">Play again with the same people</button></div>
    <p class="small muted">Starts a new game and gives your friends a button to join it.</p>`;
}
function winnerBox(){
  const ws=(game.winners&&game.winners.length>1)?game.winners:null;

  const sub=ws?'Everyone give the winners a sincere compliment.':((game.winner===me&&!game.together)?'Soak it in while everyone gives you a sincere compliment.':`Everyone give ${esc(nameOf(game.winner))} a sincere compliment.`);

    <p class="small muted" style="margin:8px 0 0">${esc(game.name||'Game')}</p>${rematchBox()}</section>`;
}
function scoreboard(){

function cardBox(cat,idx,extra){

/* Rounds: "Round 3: 2 of 4 have played", plus the 12-hour note once only one player is left. */
function roundHead(){
  const rd=roundNo(),hum=game.players.filter(p=>!isBot(p)),nd=hum.filter(isDone).length;
  const lc=!game.together&&game.lastCall&&game.lastCall.round===rd?game.lastCall:null;let extra='';
  if(lc){const h=Math.max(1,Math.ceil((lc.at+ROUND_WAIT_MS-Date.now())/3600000));
    extra=lc.who===me?` Everyone else has played. You have about ${h} hour${h===1?'':'s'} left to play before round ${rd+1} starts without you.`
      :` ${esc(nameOf(lc.who))} is the last one. If they haven’t played in about ${h} hour${h===1?'':'s'}, round ${rd+1} starts anyway.`}
  return `<p class="small muted"><b>Round ${rd}</b> · ${nd} of ${hum.length} have played.${extra}</p>`;
}
/* Pass-around: "Pass the device" screen. Whoever is holding it taps their own name (any order within the round). */
function handoffPanel(){
  const left=game.players.filter(p=>!isDone(p)),rd=roundNo();
  const first=rd===1&&left.length===game.players.length;
  return `<section class="panel" id="handoff"><h2>${first?'Who’s taking the first turn? 🎲':'Pass the device 🎲'}</h2>${roundHead()}
  ${left.length?`<p>${first?'Whoever wants to go first, tap your name to take your turn.':`Round ${rd}. Hand the device to the next player. When you have it, tap your name.`}</p>
  <div class="row">${left.map(p=>`<button class="primary big" data-act="pickseat" data-arg="${esc(p)}">I’m ${esc(nameOf(p))}</button>`).join('')}</div>`
    :'<p class="muted">Starting the next round…</p>'}</section>`;
}

}

async function createTogether(names,target){
  const id=newId(),seats=names.map((_,i)=>'seat_'+(i+1)),nmap={};seats.forEach((s,i)=>nmap[s]=names[i]);
  await fs.collection('games').doc(id).set({name:defaultGameName(),mode:'rounds',together:true,status:'lobby',players:[AUTH],names:{[AUTH]:myName||'Host'},host:AUTH,target,turn:0,pending:null,saved:{},firsts:{},winner:null,createdAt:Date.now(),lastMoveAt:Date.now()});
  await fs.collection('games').doc(id).update({players:seats,names:nmap,devices:{[AUTH]:seats[0]},deviceList:[AUTH],status:'playing',round:1,roundStartedAt:Date.now(),roundDone:{},pendings:{},lastCall:null,handoff:true,lastMoveAt:Date.now()});
  return id;
}
async function startTogether(){
  const n=Math.max(2,Math.min(TG_MAX,ui.togetherN||2));
  const names=Array.from({length:n},(_,i)=>((($('#tn_'+(i+1))||{}).value)||'').trim().slice(0,20)).filter(Boolean);
  if(names.length<2){ui.msg='Type at least two first names.';return}

  const target=Math.max(1,Math.min(3,+(($('#tgt')||{}).value||2)));

/* Points for someone joining another player's card. Same options as the card, except when the card
   gives the sharing point only to the player who drew it ("1 point to the player drawing this card"):
   then joiners can only earn the commitment (or "other") points. */
/* Sharing point: a card that says "1 point for drawing this card" gives it to the drawer only,
   unless it also opens sharing to everyone ("all players are welcome to share", "each player may..."). */
const DRAWER_PT=/drawing this card|drew this card|draws this card|player drawing/i;
const ALL_SHARE=/all players are welcome|to all players|each player may|any player may (also )?share/i;
/* "I already do this" options any player can claim (checked by hand, Nov 2026). On every other card
   that option is for the drawer only ("If you drew this card and..."). */
const OTHER_ANY=new Set(['M8','T6','B30','H38']);
function joinLimit(p){
  const l=ptsLimit(p.cat,p.idx);const t=cardText(p.cat,p.idx);
  const share=DRAWER_PT.test(t)&&!ALL_SHARE.test(t)?0:l.share;
  const anyOther=OTHER_ANY.has(p.cat+p.idx);
  const j=Object.assign({},l,{share,other:anyOther?l.other:'',otherPts:anyOther?l.otherPts:0});
  j.max=Math.min(l.max,j.share+j.commit+j.otherPts);
  return j;
}
function joinPanel(p){
  const l=joinLimit(p);const plus=n=>n?` <b>(+${n})</b>`:'';

  const others=game.players.filter(x=>x!==me);
  return `<div class="field"><label for="j_${p.id}">Your answer (optional if you said it out loud)</label><textarea id="j_${p.id}" rows="3"></textarea></div>

  if(a==='commit'){ui.commitOpen=b.checked;render();return}

  if(a==='tipok'){ui.tipSkips.add(arg);if(arg.startsWith('over:')){const s=tipSeen();s.add(arg);lsSet('bm_tipseen',JSON.stringify([...s]))}if(arg.startsWith('ans:'))ui.tipAns=arg.slice(4);applyTip();return}
  if(a==='tipoff'){lsSet('bm_tips','off');render();return}
  if(a==='tipson'){if(tipsOn())lsSet('bm_tips','off');else{lsSet('bm_tips','on');lsSet('bm_turns','0');lsSet('bm_tipseen','[]');ui.tipSkips.clear()}render();return}
  if(a==='joinopen'){ui.joinOpen=arg;const jp=posts.find(x=>x.id===arg);const jl=jp?joinLimit(jp):{share:0};ui.jShare=jl.share>0;ui.jOther=false;ui.jCommit=false;render();return}
  if(a==='jopt'){if(arg==='share')ui.jShare=b.checked;else if(arg==='other')ui.jOther=b.checked;else ui.jCommit=b.checked;render();return}
  if(a==='joinclose'){ui.joinOpen=null;render();return}
  if(a==='editname'){ui.editName=true;render();return}
  if(a==='newhere'){ui.newHere=true;render();const n=$('#myname');if(n)n.focus();return}
  if(a==='partyclose'){party=null;clearTimeout(partyTimer);render();return}
  if(a==='sheetcopy'){copyText(sheetText(),'Game sheet copied. Paste it into notes, a message or an email.','');return}
  if(a==='sheetmail'){location.href='mailto:?subject='+encodeURIComponent('My Better Me game sheet')+'&body='+encodeURIComponent(sheetText());return}
  if(a==='sheetprint'){loadFulls().then(()=>setTimeout(()=>{document.body.classList.add('printsheet');window.print();setTimeout(()=>document.body.classList.remove('printsheet'),500)},300));return}
  if(a==='sheetcal'){sheetIcs();return}
  if(a==='home'){openGame(null);return}
  if(a==='hidenew'){ui.actHide=true;render();return}
  if(a==='jumpnew'){const el=document.querySelector('.newchip');if(el){let d=el.closest('details');while(d){d.open=true;d=d.parentElement&&d.parentElement.closest('details')}el.scrollIntoView({behavior:'smooth',block:'center'})}return}
  if(a==='open'){openGame(arg);return}
  if(a==='copylink'){copyText(SITE_URL+'#'+gid,'Link copied. Paste it into WhatsApp, Messenger or LINE.','roomlink');return}
  if(a==='share'){const text=`Join me for a game of Better Me! It’s a friendly, free game where we take turns answering cards about Heart, Mind, Body, People and Tangibles, and cheer each other on. No app or sign-up: tap the link and type your first name. (${game.name||'Better Me'})`;
    if(navigator.share){navigator.share({title:'Better Me game',text,url:SITE_URL+'#'+gid}).catch(()=>{})}
    else copyText(text+' '+SITE_URL+'#'+gid,'Invite copied. Paste it into WhatsApp, Messenger, LINE or a text.','roomlink');return}
  if(a==='react'){toggleReact(arg).catch(e=>{console.warn('react',e);ui.msg='That reaction didn’t save. Try again in a moment.';render()});return}
  if(a==='tadd'){ui.togetherN=Math.min(TG_MAX,(ui.togetherN||2)+1);render();return}
  if(a==='tstart'){act(startTogether);return}
  if(a==='pickseat'){act(()=>pickSeat(arg));return}
  if(a==='playagain'){act(playAgain);return}
  if(a==='joinnext'){ui.autoJoin=arg;openGame(arg);return}
  if(a==='skiprd'){act(()=>skipRound(arg));return}
  if(a==='nudge'&&isRounds()){const nms=leftThisRound().map(p=>nameOf(p)).join(' and ');copyText(`Hi ${nms}! Round ${roundNo()} of Better Me (${game.name||'our game'}) is waiting for your card: ${SITE_URL}#${gid}`,'Copied. Paste it into WhatsApp, Messenger, LINE or a text.','');return}
  if(a==='nudge'){copyText(`${nameOf(curPlayer())}, it’s your turn in Better Me (${game.name||'our game'})! ${SITE_URL}#${gid} (If it asks, tap “I’m ${nameOf(curPlayer())}”.)`,'Copied. Paste it into WhatsApp, Messenger, LINE or a text.','');return}
  if(a==='hide'||a==='unhide'){const s=hiddenSet();if(a==='hide')s.add(arg);else s.delete(arg);lsSet('bm_hidden',JSON.stringify([...s]));render();return}
  if(a==='rename'){ui.renaming=true;render();setTimeout(()=>{const i=$('#gname');if(i){i.focus();i.select()}},0);return}
  if(a==='renamecancel'){ui.renaming=false;render();return}
  if(a==='renamesave'){const v=((($('#gname')||{}).value)||'').trim().slice(0,40);if(!v){ui.msg='Type a name for the game.';render();return}
    act(async()=>{await G().update({name:v});ui.renaming=false});return}
  const map={savename:saveName,new:newGame,join:joinGame,spin,pass:passCard,save:saveCard,post:postAnswer,skip:skipTurn,endnow:endNow,
    suggest:addSuggestion,practice:newPractice,plus:()=>plusOne(arg),remove:()=>removePlayer(arg),claimask:()=>claimAsk(arg),claimas:()=>claimAs(arg),linkreq:()=>{const [u,seat]=arg.split('|');return linkReq(u,seat)},merge:()=>mergeSeat(arg),unwatch:()=>{ui.justWatch=false},notdup:()=>{lsSet('bm_notdup_'+gid,'1')},claimcancel:claimCancel,claimyes:()=>claimYes(arg),claimno:()=>claimNo(arg),joinreq:joinReq,joinreqcancel:joinReqCancel,joinyes:()=>joinYes(arg),joinno:()=>joinNo(arg),justwatch:()=>{ui.justWatch=true},visok:visOk,alertson:alertsEnable,alertsoff:alertsDisable,
    start:()=>startGame(+(($('#target')||{}).value||2)),choose:()=>choose(arg),playsaved:()=>playSaved(+arg),
    joinpost:()=>joinIn(arg),done:()=>markDone(arg),ffpost:()=>postFF(arg),note:()=>addNote(arg),asknote:()=>{const p=posts.find(x=>x.id===arg);return addNote(arg,p?`How’s it going with: ${p.commit.text}?`:'')},heart:()=>{const [c,i]=arg.split(':');return toggleHeart(c,+i)}};
  if(map[a])act(map[a]);
});
boot();
/* Installable site + turn alerts: the service worker (sw.js) shows alerts; it caches nothing. */
if('serviceWorker' in navigator)navigator.serviceWorker.register('/sw.js').catch(e=>console.warn('sw',e));
/* ---------- new version notice (Dan, 2026-11-14) ----------
   A friend kept an old copy of the page open after an update and saw "📷 Photo" instead of the photo.
   Every few minutes (and when the tab comes back into view) the page checks site/version.txt;
   if the site changed, a small "Better Me was updated. Refresh" bar appears. No auto-reload, so nothing typed is lost. */
function checkVersion(){
  if(document.hidden||typeof BUILD==='undefined'||$('#newver'))return;
  fetch('/version.txt?'+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.text():'').then(v=>{v=(v||'').trim();
    if(/^[0-9a-f]{6,16}$/.test(v)&&v!==BUILD&&!$('#newver')){const b=document.createElement('div');b.id='newver';b.setAttribute('role','status');
      b.innerHTML='<span>✨ Better Me was updated.</span><button type="button" class="small primary">Refresh</button>';
      b.querySelector('button').onclick=()=>location.reload();document.body.appendChild(b)}}).catch(()=>{});
}
setInterval(checkVersion,4*60e3);document.addEventListener('visibilitychange',checkVersion);
